<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema Architecture</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        scene.add(new THREE.AmbientLight(0x40665c, 1.25));
        const keyLight = new THREE.PointLight(0x7dffd8, 2.4, 20);
        keyLight.position.set(3, 5, 7);
        scene.add(keyLight);

        const nodes = [];
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const pointerStart = new THREE.Vector2();
        const pointerEnd = new THREE.Vector2();
        const clickPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        const lineGeometry = new THREE.BufferGeometry();
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x8fffd2,
            transparent: true,
            opacity: 0.46
        });
        const connections = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(connections);

        renderer.domElement.addEventListener('pointerdown', event => {
            pointerStart.set(event.clientX, event.clientY);
        });

        renderer.domElement.addEventListener('pointerup', event => {
            pointerEnd.set(event.clientX, event.clientY);

            if (pointerStart.distanceTo(pointerEnd) > 5) {
                return;
            }

            addNodeAtPointer(event);
        });

        function addNodeAtPointer(event) {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const existingNodeHits = raycaster.intersectObjects(nodes.map(node => node.mesh));

            if (existingNodeHits.length > 0) {
                return;
            }

            const point = new THREE.Vector3();

            if (!raycaster.ray.intersectPlane(clickPlane, point)) {
                return;
            }

            const geometry = new THREE.SphereGeometry(0.16, 24, 16);
            const material = new THREE.MeshStandardMaterial({
                color: 0xd8ffea,
                emissive: 0x214a3d,
                roughness: 0.34,
                metalness: 0.08
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(point);
            scene.add(mesh);

            nodes.push({
                mesh,
                velocity: new THREE.Vector3()
            });
        }

        function applySpringPhysics() {
            const centerPull = 0.004;
            const repelDistance = 1.35;
            const repelStrength = 0.018;
            const damping = 0.92;

            for (let i = 0; i < nodes.length; i += 1) {
                const current = nodes[i];
                const centerForce = current.mesh.position.clone().multiplyScalar(-centerPull);
                current.velocity.add(centerForce);

                for (let j = i + 1; j < nodes.length; j += 1) {
                    const other = nodes[j];
                    const delta = current.mesh.position.clone().sub(other.mesh.position);
                    const distance = Math.max(delta.length(), 0.001);

                    if (distance < repelDistance) {
                        const force = delta.normalize().multiplyScalar((repelDistance - distance) * repelStrength);
                        current.velocity.add(force);
                        other.velocity.sub(force);
                    }
                }
            }

            nodes.forEach(node => {
                node.velocity.multiplyScalar(damping);
                node.mesh.position.add(node.velocity);
            });
        }

        function updateConnectionGeometry() {
            const vertices = [];

            for (let i = 0; i < nodes.length; i += 1) {
                for (let j = i + 1; j < nodes.length; j += 1) {
                    const a = nodes[i].mesh.position;
                    const b = nodes[j].mesh.position;
                    vertices.push(a.x, a.y, a.z, b.x, b.y, b.z);
                }
            }

            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            lineGeometry.attributes.position.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            applySpringPhysics();
            updateConnectionGeometry();
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
