<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Surrealism Melt</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160b12;color:#ffd9e6;font-family:Georgia,serif}#app{position:fixed;inset:0}.hud{position:fixed;left:24px;bottom:20px;pointer-events:none}h1{margin:0;color:#ff9cbd;font-size:clamp(2rem,6vw,5rem);font-style:italic;font-weight:400;line-height:.9}p{max-width:390px;margin:10px 0 0;color:rgba(255,217,230,.62);font-size:12px;line-height:1.5}.actions{position:fixed;right:24px;top:24px;display:flex;gap:8px;z-index:3}.actions button{min-height:34px;border:1px solid rgba(255,156,189,.28);border-radius:999px;color:#ff9cbd;background:rgba(22,11,18,.62);padding:0 12px;font:700 10px system-ui;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}</style></head>
<body><div id="app"></div><div class="actions" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()"><button id="meltBtn" type="button">Soft Melt</button><button id="restoreBtn" type="button">Restore</button></div><section class="hud"><h1>Surrealism</h1><p>Drag an object and only the touched vertices obey. Right-click reverses the distorted time.</p></section>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';
const meltBtn=document.getElementById('meltBtn');
const restoreBtn=document.getElementById('restoreBtn');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x160b12);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,2.2,12);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffa6c1,1));const l=new THREE.DirectionalLight(0xffffff,2);l.position.set(5,8,4);scene.add(l);
const mat=new THREE.MeshStandardMaterial({color:0xff86aa,roughness:.58,metalness:.05});
const meshes=[new THREE.Mesh(new THREE.BoxGeometry(2,2,2,18,18,18),mat),new THREE.Mesh(new THREE.SphereGeometry(1.15,48,32),mat.clone()),new THREE.Mesh(new THREE.TorusGeometry(1,.32,32,96),mat.clone())];
meshes[0].position.x=-3;meshes[1].position.x=0;meshes[2].position.x=3;meshes.forEach(m=>{m.geometry.userData.base=m.geometry.attributes.position.array.slice();scene.add(m)});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let active=null,hitLocal=null,dragTo=new THREE.Vector3();
function setMouse(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera)}
addEventListener('pointerdown',e=>{setMouse(e);const h=ray.intersectObjects(meshes)[0];if(h){active=h.object;hitLocal=active.worldToLocal(h.point.clone())}});
addEventListener('pointermove',e=>{setMouse(e);if(!active)return;ray.ray.at(9,dragTo);const local=active.worldToLocal(dragTo.clone());const a=active.geometry.attributes.position,base=active.geometry.userData.base;for(let i=0;i<a.count;i++){const ix=i*3;const dx=base[ix]-hitLocal.x,dy=base[ix+1]-hitLocal.y,dz=base[ix+2]-hitLocal.z;const d=Math.hypot(dx,dy,dz);const f=Math.exp(-d*1.8)*.18;a.array[ix]+= (local.x-a.array[ix])*f;a.array[ix+1]+=(local.y-a.array[ix+1])*f;a.array[ix+2]+=(local.z-a.array[ix+2])*f}a.needsUpdate=true;active.geometry.computeVertexNormals()});
addEventListener('pointerup',()=>active=null);addEventListener('contextmenu',e=>{e.preventDefault();meshes.forEach(m=>{const a=m.geometry.attributes.position,b=m.geometry.userData.base;for(let i=0;i<a.array.length;i++)a.array[i]+=(b[i]-a.array[i])*.35;a.needsUpdate=true;m.geometry.computeVertexNormals()})});
meltBtn.addEventListener('click',()=>meshes.forEach(m=>{const a=m.geometry.attributes.position;for(let i=0;i<a.count;i++){const ix=i*3;a.array[ix+1]-=Math.max(0,a.array[ix+1]+1.2)*.08;a.array[ix]+=Math.sin(a.array[ix+1]*4+i)*.025}a.needsUpdate=true;m.geometry.computeVertexNormals()}));
restoreBtn.addEventListener('click',()=>meshes.forEach(m=>{const a=m.geometry.attributes.position,b=m.geometry.userData.base;for(let i=0;i<a.array.length;i++)a.array[i]=b[i];a.needsUpdate=true;m.geometry.computeVertexNormals()}));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(t){requestAnimationFrame(animate);meshes.forEach((m,i)=>m.rotation.y+=.003+i*.001);renderer.render(scene,camera)}animate(0);
</script></body></html>
