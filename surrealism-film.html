<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1220">
<title>초현실주의 — 꿈을 그리는 법</title>
<meta name="description" content="꿈의 논리, 낯선 크기, 낮과 밤의 공존, 우연의 그림, 사진 같은 꿈 — 직접 움직이며 이해하는 초현실주의.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="concept-compare.css?v=1">
<link rel="stylesheet" href="artwork-intro.css?v=1">
<link rel="stylesheet" href="surrealism-film.css?v=2">
<link rel="stylesheet" href="home-button.css?v=1">
<link rel="stylesheet" href="movement-frame.css?v=1">
<script src="art-audio.js?v=4" defer></script>
</head>
<body class="visual-experience artwork-intro">
<main id="atelier">
  <button class="home-icon" id="goHome" type="button" aria-label="메인으로" title="메인으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.6 12 4l8 6.6"/><path d="M6.2 9v10.5h4.3v-5.6h3v5.6h4.3V9"/></svg></button>
  <header class="masthead mf-head mf-flow"><div class="eyebrow mf-eyebrow">초현실주의 / 01</div><h1 id="sceneTitle" class="mf-title">꿈속에서는 이상한 일도 당연하다</h1><span id="sceneStatus" class="sr-only" role="status"></span></header>
  <section id="paintingIntro" aria-label="그림 들여다보기" data-reveal="#stage" data-focus=".48 .74"><figure><button id="beginStudy" type="button" aria-label="빛의 제국 속으로 들어가 초현실주의 탐구하기"><img src="morning.png" width="1120" height="1450" alt="르네 마그리트의 빛의 제국. 밝은 낮 하늘 아래 어두운 거리와 켜진 가로등이 함께 있다." fetchpriority="high"></button><figcaption>빛의 제국 <span>르네 마그리트 · 1956</span><small class="painting-invitation">그림을 클릭해 들어가기</small></figcaption></figure></section>
  <section id="stage" aria-label="초현실주의의 다섯 가지 실험">
    <canvas id="filmScene" role="img" aria-label="평범한 방이 꿈속의 방으로 바뀌는 장면"></canvas>
    <button id="sceneControl" type="button" aria-describedby="sceneHint"><span aria-hidden="true">↕</span></button>
    <div id="assetError" role="status" hidden>일부 그림을 불러오지 못했습니다. <button id="retryArt" type="button">다시 시도</button></div>
  </section>
  <figure class="art-compare" id="compareOne" aria-hidden="true" inert>
    <h2 class="compare-heading">눈으로 본 풍경 vs 꿈에서 본 풍경</h2>
    <div class="compare-grid" data-linger="마우스를 치우면 계속 진행합니다">
      <div class="compare-item"><span class="img-wrap"><img src="romanticism-wanderer.jpg" alt="안개 바다 위의 방랑자. 산과 안개를 바라보는 인물."></span><span class="compare-tag">눈으로 본 자연</span><span class="compare-credit">안개 바다 위의 방랑자<br>카스파르 다비드 프리드리히 · 1818</span></div>
      <div class="compare-item"><span class="img-wrap"><img src="gallery/surrealism-tanguy-indefinite-divisibility.jpg" alt="무한한 가분성. 알 수 없는 형태들이 서 있는 꿈속 풍경."></span><span class="compare-tag">꿈과 무의식이 지은 풍경</span><span class="compare-credit">무한한 가분성<br>이브 탕기 · 1942</span></div>
    </div>
  </figure>
  <figure class="art-compare" id="compareTwo" aria-hidden="true" inert>
    <h2 class="compare-heading">마그리트의 규칙으로 그린 그림</h2>
    <div class="compare-grid" data-linger="마우스를 치우면 계속 진행합니다">
      <div class="compare-item"><span class="img-wrap"><img src="morning.png" alt="빛의 제국. 낮의 하늘과 밤의 거리가 공존한다."><span class="spot" style="left:60%;top:20%"><span class="spot-label">낮</span></span><span class="spot" style="left:60%;top:78%"><span class="spot-label">밤</span></span></span><span class="compare-credit">빛의 제국 · 르네 마그리트 · 1956</span></div>
    </div>
    <p class="compare-note">하늘은 정오, 거리는 한밤중.</p>
  </figure>
  <footer class="film-footer">
    <div class="footer-meta"><p id="sceneCaption"></p><p id="sceneHint"></p></div>
    <div class="timeline" aria-hidden="true"><div id="filmFill"></div></div>
    <div class="transport"><button id="playPause" type="button" aria-label="영상 재생">▷</button><button id="replay" type="button" aria-label="처음부터 다시 재생">↺</button><span id="filmTime">0:00 / 1:00</span><nav id="progress" aria-label="영상 장면"><button type="button" aria-label="1장 꿈의 논리">01</button><button type="button" aria-label="2장 데페이즈망">02</button><button type="button" aria-label="3장 하늘은 낮, 거리는 밤">03</button><button type="button" aria-label="4장 우아한 시체">04</button><button type="button" aria-label="5장 사진처럼 또렷한 꿈">05</button></nav><a class="next-experience" id="enterRoom" href="index.html">꿈의 방으로 <span>↗</span></a></div>
  </footer>
  <noscript>이 영상은 자바스크립트가 필요합니다.</noscript>
</main>
<script src="concept-compare.js?v=1"></script>
<script src="surrealism-scene.js?v=3"></script>
<script src="surrealism-renderer.js?v=3"></script>
<script src="surrealism-film.js?v=3"></script>
<script src="artwork-intro.js?v=1"></script>
</body>
</html>
