<body class="finale-page">
<main id="atelier" aria-label="인상주의 — 대표작 갤러리">
<a class="home-icon" id="goHome" href="index.html" aria-label="메인으로" title="메인으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.6 12 4l8 6.6"/><path d="M6.2 9v10.5h4.3v-5.6h3v5.6h4.3V9"/></svg></a>
<header class="masthead mf-head"><span class="mf-eyebrow">1874 – 1886</span><h1 class="mf-title">인상주의</h1><p class="mf-sub">빛이 바뀌면, 색도 바뀐다.</p></header>
<section class="museum" data-world="plein-air" aria-label="인상주의 대표작">
<ol class="museum-wall" tabindex="0" aria-label="인상주의 대표작 다섯 점. 좌우로 넘겨 감상하세요">
<li class="work"><figure><span class="work-frame"><img src="1.png" width="1024" height="1536" alt="모네의 루앙 대성당. 푸른빛과 보랏빛 아침 햇살 속의 고딕 성당 정면" decoding="async"></span><figcaption class="work-label"><strong>루앙 대성당</strong><em>La Cathédrale de Rouen</em><span>클로드 모네 · 1894</span><p>같은 성당을 서른 번 넘게 그렸다. 모네가 그린 것은 돌이 아니라, 그 위를 지나가는 빛이었다.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/impressionism-impression-sunrise.jpg" width="1600" height="1245" alt="모네의 인상, 해돋이. 푸르스름한 안개 속 항구 위로 주황빛 해가 떠 있고, 작은 배들이 물 위에 검은 그림자로 떠 있다" decoding="async"></span><figcaption class="work-label"><strong>인상, 해돋이</strong><em>Impression, soleil levant</em><span>클로드 모네 · 1872</span><p>‘인상주의’라는 이름이 바로 이 그림의 제목에서 나왔다. 안개 낀 항구 위에 뜬 주황빛 해 하나.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/impressionism-ballet-class.jpg" width="1800" height="2067" alt="드가의 무용 수업. 흰 튀튀를 입은 발레리나들이 연습실에 모여 있고, 지팡이를 짚은 나이 든 무용 교사가 가운데 서 있다" loading="lazy" decoding="async"></span><figcaption class="work-label"><strong>무용 수업</strong><em>La Classe de danse</em><span>에드가 드가 · 1871–1874</span><p>무대 뒤 연습실의 한순간을, 사진처럼 비스듬한 시선으로 붙잡았다.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/impressionism-woman-with-a-parasol.jpg" width="1800" height="2236" alt="모네의 파라솔을 든 여인. 언덕 위에서 초록 파라솔을 든 여인이 바람을 맞으며 내려다보고, 뒤쪽에 작은 소년이 서 있다" loading="lazy" decoding="async"></span><figcaption class="work-label"><strong>파라솔을 든 여인</strong><em>La Promenade</em><span>클로드 모네 · 1875</span><p>바람과 햇빛 속 산책의 한순간. 빠른 붓질이 흔들리는 풀과 흐르는 구름을 그린다.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/impressionism-moulin-de-la-galette.jpg" width="1800" height="1341" alt="르누아르의 물랭 드 라 갈레트의 무도회. 야외 무도회장에서 사람들이 춤추고 이야기하며, 나뭇잎 사이로 내린 햇빛이 옷 위에 얼룩진다" loading="lazy" decoding="async"></span><figcaption class="work-label"><strong>물랭 드 라 갈레트의 무도회</strong><em>Bal du moulin de la Galette</em><span>피에르오귀스트 르누아르 · 1876</span><p>나뭇잎 사이로 떨어진 햇빛이 춤추는 사람들의 옷과 얼굴 위에서 반짝인다.</p></figcaption></figure></li>
</ol>
</section>
