<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Art Movements</title>
    <link rel="stylesheet" href="style.css?v=hand-ux-state-1">
</head>
<body class="view-hub">
    <div class="cinematic-stage" id="cinematicStage">
        <section class="hub-screen" id="hubScreen" aria-label="Interaction hub" data-movement="renaissance">
            <div class="hub-bg-tint" id="hubBgTint" aria-hidden="true"></div>
            <main class="clock-hub timeline-hub" aria-label="Circular timeline of art movement sites">
                <header class="hub-header">
                    <p>Graduation Exhibition / Interactive Motion Media</p>
                    <h1>Five Art Movements That Shaped Me</h1>
                </header>

                <section class="clock-stage timeline-clock" aria-label="Current art movement">
                    <div class="clock-readout feature-readout">
                        <span id="featureHour">01</span>
                        <strong id="featureTitle">RENAISSANCE</strong>
                        <small id="featureMeta">c. 1400-1600</small>
                    </div>
                </section>

                <section class="timeline-rail" aria-label="Scroll interaction cards">
                    <div class="timeline-track" id="timelineTrack">
                        <button class="timeline-card art-card renaissance-card active" type="button" data-hour="1" data-site="renaissance">
                            <span class="card-hour">01</span>
                            <strong>RENAISSANCE</strong>
                            <small>c. 1400-1600</small>
                            <span class="card-artwork">
                                <span>Raffaello Sanzio</span>
                                <em>The School of Athens</em>
                                <span>1509-1511</span>
                            </span>
                        </button>
                        <button class="timeline-card art-card surrealism-card" type="button" data-hour="2" data-site="impressionism">
                            <span class="card-hour">02</span>
                            <strong>SURREALISM</strong>
                            <small>1924-1966</small>
                            <span class="card-artwork">
                                <span>Rene Magritte</span>
                                <em>The Empire of Light</em>
                                <span>1956</span>
                            </span>
                        </button>
                        <button class="timeline-card art-card impressionism-card" type="button" data-hour="4" data-site="impressionism-time">
                            <span class="card-hour">04</span>
                            <strong>IMPRESSIONISM</strong>
                            <small>c. 1874-1886</small>
                            <span class="card-artwork">
                                <span>Claude Monet</span>
                                <em>Rouen Cathedral</em>
                                <span>1894</span>
                            </span>
                        </button>
                        <button class="timeline-card art-card bauhaus-card" type="button" data-hour="3">
                            <span class="card-hour">03</span>
                            <strong>BAUHAUS</strong>
                            <small>1919-1933</small>
                            <span class="card-artwork">
                                <span>Bauhaus Workshop</span>
                                <em>Lage der Ebenen zu Einander</em>
                                <span>c. 1923</span>
                            </span>
                        </button>
                        <button class="timeline-card art-card romanticism-card" type="button" data-hour="5" data-site="romanticism">
                            <span class="card-hour">05</span>
                            <strong>ROMANTICISM</strong>
                            <small>c. 1798-1850</small>
                            <span class="card-artwork">
                                <span>Caspar David<br>Friedrich</span>
                                <em>Wanderer above<br>the Sea of Fog</em>
                                <span>1818</span>
                            </span>
                        </button>
                    </div>
                </section>
            </main>
        </section>

        <div class="site-transition" id="siteTransition" aria-hidden="true">
            <div class="transition-ripple"></div>
        </div>

        <section class="interaction-screen" id="interactionScreen" aria-label="Art movement interaction">
            <button class="back-button" id="backToShelf" type="button" aria-label="Return home">
                <span class="home-label">Home</span>
            </button>

            <div class="interaction-content impressionism-site">
                <header class="site-header">
                    <h1>SURREALISM</h1>
                </header>

                <main class="main-container surreal-room" aria-label="Surrealism room window">
                    <section class="music-player side-player" id="musicPlayer" aria-label="Music control">
                        <div class="now-playing">
                            <div>
                                <h2 class="track-title" id="trackTitle">Morning Music</h2>
                                <p class="track-info" id="trackInfo">Surrealism Study</p>
                            </div>
                            <button id="playPauseBtn" class="player-button" aria-label="Play">&#9654;</button>
                        </div>

                    <div class="progress-panel" aria-hidden="true">
                        <div class="time-row">
                            <span id="currentTime">0:00</span>
                            <span id="durationTime">0:00</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </section>

                <section class="player-shell">
                    <div class="album-art-container room-window" aria-label="Window view">
                        <div class="window-reveal">
                            <div class="scene" id="morningScene"></div>
                            <div class="scene" id="nightScene"></div>
                            <div class="scene" id="vincentMorningScene"></div>
                            <div class="scene" id="vincentNightScene"></div>
                        </div>
                        <div class="window-frame" aria-hidden="true">
                            <span class="muntin muntin-vertical"></span>
                            <span class="muntin muntin-horizontal"></span>
                        </div>
                        <div class="curtain curtain-left" aria-hidden="true"></div>
                        <div class="curtain curtain-right" aria-hidden="true"></div>
                        <div class="window-sill" aria-hidden="true"></div>
                        <div class="room-shadow" aria-hidden="true"></div>
                        <div class="album-overlay">
                            <span class="album-tag" id="albumTag">Morning</span>
                        </div>
                    </div>
                </section>
                <div class="room-furniture" aria-hidden="true">
                    <span class="wall-picture"></span>
                    <span class="floor-lamp"></span>
                    <span class="side-table"></span>
                </div>
            </main>
        </div>

        <button class="pull-chain" id="pullChain" aria-label="Switch day and night">
            <span class="chain"></span>
            <span class="handle"></span>
        </button>

        <div class="interaction-content particle-site" aria-label="Particle interaction">
            <header class="site-header particle-header">
                <h1>PARTICLE</h1>
            </header>

            <main class="particle-stage" aria-label="Particle stage">
                <section class="particle-canvas" aria-label="Particle canvas">
                    <iframe class="particle-frame" src="particle.html" title="Particle"></iframe>
                </section>
            </main>
        </div>

        <div class="interaction-content renaissance-site" aria-label="Renaissance interaction">
            <main class="renaissance-stage" aria-label="Renaissance perspective stage">
                <iframe class="renaissance-frame" data-src="renaissance.html" title="Renaissance Perspective Engine"></iframe>
            </main>
        </div>

        <div class="interaction-content baroque-site" aria-label="Baroque interaction">
            <main class="baroque-stage" aria-label="Baroque hidden vault stage">
                <iframe class="baroque-frame" data-src="baroque.html" title="Baroque Hidden Vault"></iframe>
            </main>
        </div>

        <div class="interaction-content fluid-site" aria-label="Fluid Collision interaction">
            <header class="site-header fluid-header">
                <h1>DIGITAL ABSTRACT</h1>
            </header>

            <main class="fluid-stage" aria-label="Fluid Collision stage">
                <section class="fluid-canvas" aria-label="Fluid shader canvas">
                    <iframe class="fluid-frame" src="fluid-collision.html" title="Fluid Collision"></iframe>
                </section>

                <section class="fluid-panel" aria-label="Fluid controls">
                    <strong>FLOW</strong>
                    <small>Drag to disturb</small>
                    <small>Red + Blue = Purple</small>
                </section>
            </main>
        </div>

        <div class="interaction-content romanticism-site" aria-label="Romanticism interaction">
            <main class="romanticism-stage" aria-label="Romanticism storm ocean stage">
                <iframe class="romanticism-frame" data-src="romanticism.html" title="Romanticism Storm"></iframe>
            </main>
        </div>

        <div class="interaction-content impressionism-time-site" aria-label="Impressionism interaction">
            <main class="impressionism-time-stage" aria-label="Impressionism time and temperature stage">
                <iframe class="impressionism-time-frame" data-src="impressionism.html" title="Impressionism Time Study"></iframe>
            </main>
        </div>
    </section>
    </div>

    <aside class="hand-tracker" id="handTracker" aria-label="Hand gesture controls">
        <button class="hand-tracker-toggle" id="handTrackerToggle" type="button" aria-pressed="false">
            <span class="hand-tracker-dot" aria-hidden="true"></span>
            <span id="handTrackerLabel">HAND</span>
        </button>
        <div class="hand-tracker-preview" id="handTrackerPreview" hidden>
            <video id="handTrackerVideo" playsinline muted aria-hidden="true"></video>
            <canvas id="handTrackerCanvas" aria-hidden="true"></canvas>
            <p class="hand-tracker-status" id="handTrackerStatus" role="status">CAMERA READY</p>
        </div>
    </aside>
    <div class="hand-cursor" id="handCursor" aria-hidden="true"></div>

    <script src="script.js?v=hand-ux-state-1"></script>
    <script type="module" src="hand-tracking.js?v=hand-ux-state-1"></script>
</body>
</html>
