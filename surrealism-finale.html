<body class="finale-page">
<main id="atelier" aria-label="초현실주의 — 대표작 갤러리">
<a class="home-icon" id="goHome" href="index.html" aria-label="메인으로" title="메인으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.6 12 4l8 6.6"/><path d="M6.2 9v10.5h4.3v-5.6h3v5.6h4.3V9"/></svg></a>
<header class="masthead mf-head"><span class="mf-eyebrow">1924 – 1966</span><h1 class="mf-title">초현실주의</h1><p class="mf-sub">꿈과 무의식을, 현실보다 선명하게 그리다</p></header>
<section class="museum" data-world="dream" aria-label="초현실주의 대표작">
<ol class="museum-wall" tabindex="0" aria-label="초현실주의 대표작 네 점. 좌우로 넘겨 감상하세요">
<li class="work"><figure><span class="work-frame"><img src="morning.png" width="1120" height="1450" alt="르네 마그리트의 빛의 제국. 흰 구름이 뜬 밝은 낮 하늘 아래, 어두운 나무와 가로등이 켜진 밤의 집이 물 위에 비친다" decoding="async"></span><figcaption class="work-label"><strong>빛의 제국</strong><em>L'Empire des lumières</em><span>르네 마그리트 · 1956</span><p>환한 낮의 하늘 아래 가로등이 켜진 밤의 거리. 함께 있을 수 없는 두 시간이 한 화면에 놓인다.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/surrealism-tanguy-dark-garden.jpg" width="1800" height="2268" alt="이브 탕기의 어두운 정원. 수평선이 보이는 어두운 바닥 위에 해초나 연기 같은 알 수 없는 형체들이 흩어져 있다" decoding="async"></span><figcaption class="work-label"><strong>어두운 정원</strong><em>Le Jardin sombre</em><span>이브 탕기 · 1928</span><p>바다인지 땅인지 모를 어둠 속에, 이름 붙일 수 없는 형체들이 꿈처럼 떠 있다.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/surrealism-tanguy-indefinite-divisibility.jpg" width="1800" height="2069" alt="이브 탕기의 무한한 가분성. 안개 낀 푸른 평원 위에 뼈와 기계 부품을 닮은 형상이 탑처럼 쌓여 긴 그림자를 드리운다" loading="lazy" decoding="async"></span><figcaption class="work-label"><strong>무한한 가분성</strong><em>Divisibilité indéfinie</em><span>이브 탕기 · 1942</span><p>끝없는 평원 위, 뼈와 돌을 닮은 형상들이 긴 그림자를 드리운다. 무의식이 지은 풍경.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/surrealism-tanguy-imaginary-numbers.jpg" width="1800" height="2199" alt="이브 탕기의 상상의 수. 회색빛 돌과 뼈를 닮은 수많은 형상이 계단처럼 겹겹이 쌓여 먼 지평선까지 이어진다" loading="lazy" decoding="async"></span><figcaption class="work-label"><strong>상상의 수</strong><em>Nombres imaginaires</em><span>이브 탕기 · 1954</span><p>수없이 쌓인 돌 같은 형상들이 지평선까지 이어진다. 현실에는 없는, 꿈속에서만 셀 수 있는 수.</p></figcaption></figure></li>
</ol>
