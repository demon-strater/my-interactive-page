<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e9dcc4"><title>인상주의 — 빛으로 그린 한순간</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="impressionism-film.css?v=1"></head>
<body><main id="atelier" aria-label="인상주의를 이해하기 위한 56초짜리 시각적 영상">
<canvas id="filmScene" aria-hidden="true"></canvas><div class="scene-shade"></div>
<header class="masthead"><div class="eyebrow">인상주의</div><h1 id="sceneTitle"></h1><p class="caption" id="sceneStatus" role="status"></p></header>
<footer><div class="timeline"><div id="filmFill"></div><input id="filmSeek" type="range" min="0" max="56" step=".01" value="0" aria-label="영상 재생 위치"></div><div class="transport"><button id="playPause" aria-label="영상 일시정지">Ⅱ</button><button id="replay" aria-label="처음부터 다시 재생">↺</button><span id="filmTime"></span><nav id="progress" aria-label="영상 장면"><button aria-label="장면 1">01</button><button aria-label="장면 2">02</button><button aria-label="장면 3">03</button><button aria-label="장면 4">04</button><button aria-label="장면 5">05</button></nav><a class="imp-next" id="impNext" href="post-impressionism.html">다음 사조 <span>↗</span></a></div></footer>
<noscript>이 시각적 영상은 자바스크립트가 필요합니다. 인상주의는 빛과 지나가는 순간을 색으로 포착합니다.</noscript>
</main><script src="impressionism-scene.js?v=1"></script><script src="impressionism-film.js?v=2"></script></body></html>
