<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인상주의 — 빛의 조각들</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="impressionism.css?v=glass-1"><link rel="stylesheet" href="movement-frame.css?v=1"></head>
<body>
<main id="gallery" aria-label="빛에 따라 변하는 대성당 연작">
<div id="pages">
<section class="gallery-page" id="wholePage" aria-label="하루의 빛에 따라 변하는 대성당">
<header class="mf-head mf-narrow"><span class="mf-eyebrow">인상주의 / 01</span><h1 class="mf-title">하나의 성당,<br>천 개의 시간.</h1></header>
<div class="painting-wrap">
<canvas id="wholePainting" aria-label="하루의 빛에 따라 색이 변하는 루앙 대성당"></canvas>
<div class="day-controls"><input id="dayTime" type="range" min="0" max="7" step=".001" value="0" aria-label="하루 중 시각"></div>
</div>
<aside class="time-signature"><span>01 / 흘러가는 빛</span><strong id="wholeTime">06:00</strong></aside>
<div class="playtime-control"><button id="playTime" type="button" aria-label="빛의 흐름 일시정지">일시정지 II</button></div>
<div class="speed-gauge" id="speedGauge">
<div class="gauge-face">
<svg viewBox="0 0 200 200" aria-hidden="true">
<circle class="gauge-ring" cx="100" cy="100" r="90"/>
<path class="gauge-arc-track" d="M30.72,140 A80,80 0 1 1 169.28,140"/>
<path class="gauge-progress" id="gaugeProgress" d="M30.72,140 A80,80 0 0 1 67.46,26.92"/>
<g class="gauge-ticks">
<line class="gauge-tick" x1="39.38" y1="135" x2="31.61" y2="139.5"/>
<line class="gauge-tick" x1="33.42" y1="78.37" x2="24.75" y2="75.44"/>
<line class="gauge-tick" x1="71.53" y1="36.05" x2="67.51" y2="27.14"/>
<line class="gauge-tick" x1="128.47" y1="36.05" x2="132.49" y2="27.14"/>
<line class="gauge-tick" x1="166.58" y1="78.37" x2="175.25" y2="75.44"/>
<line class="gauge-tick" x1="160.62" y1="135" x2="168.39" y2="139.5"/>
</g>
<g id="gaugeNeedle" class="gauge-needle" style="transform-origin:100px 100px;transform:rotate(-24deg)">
<line x1="100" y1="100" x2="100" y2="38" stroke="#9b7845" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="100" cy="100" r="4.5" fill="#9b7845"/>
</g>
</svg>
<div class="gauge-readout" aria-live="polite"><span id="speedValue">1×</span><small>속도</small></div>
</div>
<div class="gauge-buttons">
<button id="speedDown" type="button" aria-label="빛이 흐르는 속도 늦추기">&#8722;</button>
<button id="speedUp" type="button" aria-label="빛이 흐르는 속도 높이기">&#43;</button>
</div>
</div>
<button class="page-next" id="nextPage" type="button">빛의 조각들 &#8594;</button>
</section>
<section class="gallery-page" id="fragmentPage" aria-label="저마다 다른 시간을 품은 대성당 조각들" inert>
<header class="mf-head mf-narrow"><span class="mf-eyebrow">인상주의 / 02</span><h1 class="mf-title">빛의<br>조각들.</h1></header>
<div class="painting-wrap" id="fragmentArt">
<canvas id="fragmentPainting" aria-label="유리처럼 깨진 대성당. 조각마다 저마다의 빛의 순간을 간직하고 있습니다"></canvas>
<svg id="shardTargets" aria-label="조각을 선택해 그 조각의 시간을 조절하세요"></svg>
</div>
<div class="speed-gauge" id="speedGauge2">
<div class="gauge-face">
<svg viewBox="0 0 200 200" aria-hidden="true">
<circle class="gauge-ring" cx="100" cy="100" r="90"/>
<path class="gauge-arc-track" d="M30.72,140 A80,80 0 1 1 169.28,140"/>
<path class="gauge-progress" id="gaugeProgress2" d="M30.72,140 A80,80 0 0 1 67.46,26.92"/>
<g class="gauge-ticks">
<line class="gauge-tick" x1="39.38" y1="135" x2="31.61" y2="139.5"/>
<line class="gauge-tick" x1="33.42" y1="78.37" x2="24.75" y2="75.44"/>
<line class="gauge-tick" x1="71.53" y1="36.05" x2="67.51" y2="27.14"/>
<line class="gauge-tick" x1="128.47" y1="36.05" x2="132.49" y2="27.14"/>
<line class="gauge-tick" x1="166.58" y1="78.37" x2="175.25" y2="75.44"/>
<line class="gauge-tick" x1="160.62" y1="135" x2="168.39" y2="139.5"/>
</g>
<g id="gaugeNeedle2" class="gauge-needle" style="transform-origin:100px 100px;transform:rotate(-24deg)">
<line x1="100" y1="100" x2="100" y2="38" stroke="#9b7845" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="100" cy="100" r="4.5" fill="#9b7845"/>
</g>
</svg>
<div class="gauge-readout" aria-live="polite"><span id="speedValue2">1×</span><small>속도</small></div>
</div>
<div class="gauge-buttons">
<button id="speedDown2" type="button" aria-label="조각의 빛이 흐르는 속도 늦추기">&#8722;</button>
<button id="speedUp2" type="button" aria-label="조각의 빛이 흐르는 속도 높이기">&#43;</button>
</div>
</div>
<button id="hammer" type="button" aria-label="망치로 그림을 내리쳐 스테인드글라스처럼 깨뜨리기">
<svg viewBox="0 0 150 230" aria-hidden="true">
<defs>
<linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f8983"/><stop offset=".18" stop-color="#3a3530"/><stop offset=".38" stop-color="#5c5650"/><stop offset=".55" stop-color="#221f1c"/><stop offset=".72" stop-color="#6b6259"/><stop offset="1" stop-color="#161412"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a49c8e"/><stop offset=".5" stop-color="#4b453e"/><stop offset="1" stop-color="#221f1b"/></linearGradient>
<linearGradient id="oldwood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#20110a"/><stop offset=".3" stop-color="#623c1f"/><stop offset=".5" stop-color="#8f6033"/><stop offset=".7" stop-color="#54341c"/><stop offset="1" stop-color="#180d06"/></linearGradient>
</defs>
<path d="M55,58 Q46,100 48,150 Q50,190 44,214 Q43,220 48,222 Q55,224 60,220 Q62,190 56,150 Q54,100 63,58 Z" fill="url(#oldwood)" stroke="#160c04" stroke-width="1"/>
<path d="M10,18 Q38,10 58,26 L104,36 Q122,42 104,50 L58,60 Q38,76 10,68 Q3,54 5,43 Q3,32 10,18 Z" fill="url(#iron)" stroke="#100e0c" stroke-width="1.6"/>
<path d="M10,18 Q4,32 6,43 Q4,54 10,68" fill="none" stroke="url(#face)" stroke-width="8" stroke-linecap="round"/>
<ellipse cx="52" cy="43" rx="9" ry="15" fill="#100d0a" opacity=".82"/>
<ellipse cx="52" cy="43" rx="9" ry="15" fill="none" stroke="#4a3f2e" stroke-width="1.4"/>
<path d="M20,26 Q45,20 62,32" fill="none" stroke="#c9c2b4" stroke-width="1.3" opacity=".45"/>
<path d="M20,60 Q45,66 62,54" fill="none" stroke="#050403" stroke-width="1.3" opacity=".5"/>
</svg>
</button>
<aside class="time-signature"><span>02 / 조각난 시간</span><strong id="fragmentTime">하나의 빛</strong></aside>
<div class="fragment-controls"><button id="resetGlass" type="button">되돌리기</button><button id="pauseFragments" type="button" aria-pressed="false">일시정지 II</button></div>
<button class="page-back" id="previousPage" type="button">&#8592; 뒤로</button>
</section>
</div>
<div id="imageStatus" role="status">빛을 모으는 중…</div>
</main><script src="impressionism.js?v=glass-1"></script>
</body></html>
