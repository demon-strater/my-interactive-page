<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressionism — Fragments of Light</title><link rel="stylesheet" href="impressionism.css"><link rel="stylesheet" href="internal-navigation.css">
</head>
<body>
<main id="gallery" aria-label="Impressionist cathedral studies">
<div id="pages">
<section class="gallery-page" id="wholePage" aria-label="Cathedral in changing daylight">
<header><span>CLAUDE MONET / ROUEN</span><h1>A cathedral.<br>A thousand hours.</h1></header>
<div class="painting-wrap">
<canvas id="wholePainting" aria-label="Rouen Cathedral changing with the daylight"></canvas>
<div class="day-controls"><input id="dayTime" type="range" min="0" max="7" step=".001" value="0" aria-label="Time of day"></div>
</div>
<aside class="time-signature"><span>01 / THE PASSING LIGHT</span><strong id="wholeTime">06:00</strong></aside>
<div class="playtime-control"><button id="playTime" type="button" aria-label="Pause daylight">Pause II</button></div>
<div class="speed-gauge" id="speedGauge">
<div class="gauge-face">
<svg viewBox="0 0 200 200" aria-hidden="true">
<circle class="gauge-ring" cx="100" cy="100" r="90"/>
<path class="gauge-arc-track" d="M30.72,140 A80,80 0 1 1 169.28,140"/>
<path class="gauge-progress" id="gaugeProgress" d="M30.72,140 A80,80 0 0 1 67.46,26.92"/>
<g class="gauge-ticks">
<line class="gauge-tick" x1="39.38" y1="135" x2="31.61" y2="139.5"/>
<line class="gauge-tick" x1="33.42" y1="78.37" x2="24.75" y2="75.44"/>
<line class="gauge-tick" x1="71.53" y1="36.05" x2="67.51" y2="27.14"/>
<line class="gauge-tick" x1="128.47" y1="36.05" x2="132.49" y2="27.14"/>
<line class="gauge-tick" x1="166.58" y1="78.37" x2="175.25" y2="75.44"/>
<line class="gauge-tick" x1="160.62" y1="135" x2="168.39" y2="139.5"/>
</g>
<g id="gaugeNeedle" class="gauge-needle" style="transform-origin:100px 100px;transform:rotate(-24deg)">
<line x1="100" y1="100" x2="100" y2="38" stroke="#9b7845" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="100" cy="100" r="4.5" fill="#9b7845"/>
</g>
</svg>
<div class="gauge-readout" aria-live="polite"><span id="speedValue">1×</span><small>SPEED</small></div>
</div>
<div class="gauge-buttons">
<button id="speedDown" type="button" aria-label="Slow down the passing daylight">&#8722;</button>
<button id="speedUp" type="button" aria-label="Speed up the passing daylight">&#43;</button>
</div>
</div>
<button class="page-next" id="nextPage" type="button">Fragments of Light &#8594;</button>
</section>
<section class="gallery-page" id="fragmentPage" aria-label="Cathedral fragments in different times" inert>
<header><span>IMPRESSIONISM / STUDY 02</span><h1>Fragments<br>of light.</h1></header>
<div class="painting-wrap" id="fragmentArt">
<canvas id="fragmentPainting" aria-label="The cathedral shattered into panes of glass, each keeping its own moment of light"></canvas>
<svg id="shardTargets" aria-label="Select a fragment to accelerate its time"></svg>
</div>
<div class="speed-gauge" id="speedGauge2">
<div class="gauge-face">
<svg viewBox="0 0 200 200" aria-hidden="true">
<circle class="gauge-ring" cx="100" cy="100" r="90"/>
<path class="gauge-arc-track" d="M30.72,140 A80,80 0 1 1 169.28,140"/>
<path class="gauge-progress" id="gaugeProgress2" d="M30.72,140 A80,80 0 0 1 67.46,26.92"/>
<g class="gauge-ticks">
<line class="gauge-tick" x1="39.38" y1="135" x2="31.61" y2="139.5"/>
<line class="gauge-tick" x1="33.42" y1="78.37" x2="24.75" y2="75.44"/>
<line class="gauge-tick" x1="71.53" y1="36.05" x2="67.51" y2="27.14"/>
<line class="gauge-tick" x1="128.47" y1="36.05" x2="132.49" y2="27.14"/>
<line class="gauge-tick" x1="166.58" y1="78.37" x2="175.25" y2="75.44"/>
<line class="gauge-tick" x1="160.62" y1="135" x2="168.39" y2="139.5"/>
</g>
<g id="gaugeNeedle2" class="gauge-needle" style="transform-origin:100px 100px;transform:rotate(-24deg)">
<line x1="100" y1="100" x2="100" y2="38" stroke="#9b7845" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="100" cy="100" r="4.5" fill="#9b7845"/>
</g>
</svg>
<div class="gauge-readout" aria-live="polite"><span id="speedValue2">1×</span><small>SPEED</small></div>
</div>
<div class="gauge-buttons">
<button id="speedDown2" type="button" aria-label="Slow down the fragments' passing light">&#8722;</button>
<button id="speedUp2" type="button" aria-label="Speed up the fragments' passing light">&#43;</button>
</div>
</div>
<button id="hammer" type="button" aria-label="Strike the painting with the hammer to shatter it like stained glass">
<svg viewBox="0 0 150 230" aria-hidden="true">
<defs>
<linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f8983"/><stop offset=".18" stop-color="#3a3530"/><stop offset=".38" stop-color="#5c5650"/><stop offset=".55" stop-color="#221f1c"/><stop offset=".72" stop-color="#6b6259"/><stop offset="1" stop-color="#161412"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a49c8e"/><stop offset=".5" stop-color="#4b453e"/><stop offset="1" stop-color="#221f1b"/></linearGradient>
<linearGradient id="oldwood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#20110a"/><stop offset=".3" stop-color="#623c1f"/><stop offset=".5" stop-color="#8f6033"/><stop offset=".7" stop-color="#54341c"/><stop offset="1" stop-color="#180d06"/></linearGradient>
</defs>
<path d="M55,58 Q46,100 48,150 Q50,190 44,214 Q43,220 48,222 Q55,224 60,220 Q62,190 56,150 Q54,100 63,58 Z" fill="url(#oldwood)" stroke="#160c04" stroke-width="1"/>
<path d="M10,18 Q38,10 58,26 L104,36 Q122,42 104,50 L58,60 Q38,76 10,68 Q3,54 5,43 Q3,32 10,18 Z" fill="url(#iron)" stroke="#100e0c" stroke-width="1.6"/>
<path d="M10,18 Q4,32 6,43 Q4,54 10,68" fill="none" stroke="url(#face)" stroke-width="8" stroke-linecap="round"/>
<ellipse cx="52" cy="43" rx="9" ry="15" fill="#100d0a" opacity=".82"/>
<ellipse cx="52" cy="43" rx="9" ry="15" fill="none" stroke="#4a3f2e" stroke-width="1.4"/>
<path d="M20,26 Q45,20 62,32" fill="none" stroke="#c9c2b4" stroke-width="1.3" opacity=".45"/>
<path d="M20,60 Q45,66 62,54" fill="none" stroke="#050403" stroke-width="1.3" opacity=".5"/>
</svg>
</button>
<aside class="time-signature"><span>02 / FRACTURED TIME</span><strong id="fragmentTime">One light</strong></aside>
<div class="fragment-controls"><button id="resetGlass" type="button">Restore</button><button id="pauseFragments" type="button" aria-pressed="false">Pause II</button></div>
<button class="page-back" id="previousPage" type="button">&#8592; Back</button>
</section>
</div>
<div id="imageStatus" role="status">Gathering the light...</div>
</main><script src="impressionism.js"></script>
</body></html>
