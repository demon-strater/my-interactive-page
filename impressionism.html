<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressionism — Fragments of Light</title><link rel="stylesheet" href="impressionism.css"></head>
<body>
<main id="gallery" aria-label="Impressionist cathedral studies">
<div id="pages">
<section class="gallery-page" id="wholePage" aria-label="Cathedral in changing daylight">
<header><span>CLAUDE MONET / ROUEN</span><h1>A cathedral.<br>A thousand hours.</h1></header>
<div class="painting-wrap"><canvas id="wholePainting" aria-label="Rouen Cathedral changing with the daylight"></canvas></div>
<aside class="time-signature"><span>01 / THE PASSING LIGHT</span><strong id="wholeTime">06:00</strong></aside>
<div class="day-controls"><button id="playTime" type="button" aria-label="Pause daylight">Pause II</button><input id="dayTime" type="range" min="0" max="7" step=".001" value="0" aria-label="Time of day"></div>
<button class="page-next" id="nextPage" type="button">Fragments of Light &#8594;</button>
</section>
<section class="gallery-page" id="fragmentPage" aria-label="Cathedral fragments in different times" inert>
<header><span>IMPRESSIONISM / STUDY 02</span><h1>Fragments<br>of light.</h1></header>
<div class="painting-wrap" id="fragmentArt">
<canvas id="fragmentPainting" tabindex="0" role="button" aria-label="Select the brush, then click this painting to fracture time"></canvas>
<svg id="shardTargets" aria-label="Select a fragment to accelerate its time"></svg>
</div>
<button id="brush" type="button" aria-label="Select paintbrush to fracture the painting" aria-pressed="false">
<svg viewBox="0 0 60 210" aria-hidden="true"><defs><linearGradient id="wood" x2="1" y2="0"><stop stop-color="#302219"/><stop offset=".4" stop-color="#996044"/><stop offset=".6" stop-color="#c28556"/><stop offset="1" stop-color="#3c261b"/></linearGradient><linearGradient id="silver" x2="1" y2="0"><stop stop-color="#5d615c"/><stop offset=".3" stop-color="#ede6cf"/><stop offset=".5" stop-color="#8d928e"/><stop offset=".7" stop-color="#fcf4d9"/><stop offset="1" stop-color="#676b62"/></linearGradient></defs><path d="M25 88 Q20 150 27 204 Q30 213 33 204 Q40 150 35 88Z" fill="url(#wood)"/><path d="M22 59 L38 59 L36 97 Q30 101 24 97Z" fill="url(#silver)"/><path d="M22 59 Q16 35 30 5 Q43 35 38 59Z" fill="#514439"/><path d="M24 56 Q21 29 30 8 Q29 36 33 56" fill="#b49b6f"/><path d="M30 8 Q38 27 38 43 Q32 35 27 27Z" fill="#acbad0"/></svg>
<span>Brush</span></button>
<aside class="time-signature"><span>02 / FRACTURED TIME</span><strong id="fragmentTime">One light</strong></aside>
<div class="fragment-controls"><button id="resetGlass" type="button">Restore</button><button id="pauseFragments" type="button" aria-pressed="false">Pause II</button></div>
<button class="page-back" id="previousPage" type="button">&#8592; Back</button>
</section>
</div>
<div id="imageStatus" role="status">Gathering the light...</div>
</main><script src="impressionism.js"></script>
</body></html>
