<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100e0b">
<title>Renaissance — When a Painting Becomes a Space</title>
<meta name="description" content="A visual experiment connecting the eye, the picture plane, and space. Discover perspective through moving projection lines and columns, leading into The School of Athens.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="renaissance.css?v=play-10">
<link rel="stylesheet" href="renaissance-navigation.css?v=nav-2">
</head>
<body class="visual-experience">
<main id="atelier">
  <header class="masthead"><div class="eyebrow">RENAISSANCE</div><h1 id="sceneTitle">A picture, or a space?</h1></header>
  <section id="stage" aria-label="An animated perspective model">
    <canvas id="scene" tabindex="0" aria-label="A visual perspective experiment. In the third scene, drag the teal column; in the fourth scene, drag the eye. You can also use the arrow keys."></canvas>
    <span id="sceneStatus" class="sr-only" role="status"></span>
    <figure class="art-compare" id="compareOne" aria-hidden="true">
      <div class="compare-grid">
        <div class="compare-item">
          <span class="compare-tag">No perspective</span>
          <img src="원근법%20ㄴ.jpg" alt="A flat, overlapping arrangement of objects in a traditional Chaekgado painting">
          <span class="compare-credit">Chaekgado · Artist unknown</span>
        </div>
        <div class="compare-item">
          <span class="compare-tag">With perspective</span>
          <img src="원근법ㅇ.jpg" alt="The Last Supper, with clear lines converging on a single point">
          <span class="compare-credit">The Last Supper · Leonardo da Vinci</span>
        </div>
      </div>
    </figure>
    <figure class="art-compare" id="compareTwo" aria-hidden="true">
      <div class="compare-grid three">
        <div class="compare-item">
          <span class="compare-tag">An intense, dynamic feeling</span>
          <span class="img-wrap" data-vp-key="bridge">
            <img src="소실점1.jpg" alt="Le Pont de l'Europe, with its vanishing point high on the right">
            <svg class="vp-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <line x1="3" y1="97" x2="74" y2="20"></line>
              <line x1="58" y1="97" x2="74" y2="20"></line>
            </svg>
            <span class="vp-dot" style="left:74%;top:20%" aria-hidden="true"></span>
            <span class="vp-label" style="left:74%;top:20%" aria-hidden="true">Vanishing point</span>
          </span>
          <span class="compare-credit">Le Pont de l'Europe · Gustave Caillebotte</span>
        </div>
        <div class="compare-item">
          <span class="compare-tag">A cozy, settled feeling</span>
          <span class="img-wrap" data-vp-key="bedroom">
            <img src="소실점2.jpg" alt="Bedroom in Arles, with its vanishing point centered at eye level">
            <svg class="vp-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <line x1="2" y1="97" x2="52" y2="36"></line>
              <line x1="98" y1="90" x2="52" y2="36"></line>
              <line x1="2" y1="4" x2="52" y2="36"></line>
            </svg>
            <span class="vp-dot" style="left:52%;top:36%" aria-hidden="true"></span>
            <span class="vp-label" style="left:52%;top:36%" aria-hidden="true">Vanishing point</span>
          </span>
          <span class="compare-credit">Bedroom in Arles · Vincent van Gogh</span>
        </div>
        <div class="compare-item">
          <span class="compare-tag">A balanced, majestic feeling</span>
          <span class="img-wrap" data-vp-key="athens">
            <img src="아테네%20학당.jpg" alt="The School of Athens, its vanishing point centered between the two figures">
            <svg class="vp-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <line x1="28.2" y1="18.9" x2="51.2" y2="47.1"></line>
              <line x1="72.5" y1="18.4" x2="51.2" y2="47.1"></line>
              <line x1="6" y1="97" x2="51.2" y2="47.1"></line>
              <line x1="95" y1="97" x2="51.2" y2="47.1"></line>
            </svg>
            <span class="vp-dot" style="left:51.2%;top:47.1%" aria-hidden="true"></span>
            <span class="vp-label" style="left:51.2%;top:47.1%" aria-hidden="true">Vanishing point</span>
          </span>
          <span class="compare-credit">The School of Athens · Raphael</span>
        </div>
      </div>
    </figure>
    <div id="assetError" role="status" hidden>Couldn't load the artwork. <button id="retryArt" type="button">Retry</button></div>
    <a id="artSource" href="https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/stanze-di-raffaello/stanza-della-segnatura/scuola-di-atene.html" target="_blank" rel="noopener noreferrer" hidden>Raphael · The School of Athens / Vatican Museums ↗</a>
  </section>
  <footer class="film-footer"><div class="timeline"><div id="filmFill"></div></div><div class="transport"><button id="playPause" aria-label="Pause the film">Ⅱ</button><button id="replay" aria-label="Replay from the start">↺</button><span id="filmTime"></span><nav id="progress" aria-label="Film scenes"><button aria-label="Scene 1">01</button><button aria-label="Scene 2">02</button><button aria-label="Scene 3">03</button><button aria-label="Scene 4">04</button><button aria-label="Scene 5">05</button></nav><a class="next-experience" href="renaissance-perspective.html?v=home-2">Into the space <span>↗</span></a></div></footer>
  <noscript>This visual experiment requires JavaScript.</noscript>
</main>
<script src="renaissance-model.js?v=visual-5"></script>
<script src="renaissance.js?v=play-13"></script>
<script src="renaissance-navigation.js?v=nav-11"></script>
</body>
</html>
