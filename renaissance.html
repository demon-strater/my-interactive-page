<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100e0b">
<title>르네상스 — 그림이 공간이 되는 순간</title>
<meta name="description" content="눈, 그림판, 공간을 연결하는 시각 실험. 움직이는 투영선과 기둥으로 원근법을 발견하고 아테네 학당으로 이어집니다.">
<link rel="stylesheet" href="renaissance.css?v=visual-2">
</head>
<body>
<main id="atelier">
  <header class="masthead"><div class="eyebrow">RENAISSANCE <span>01 / 원근법</span></div><h1 id="sceneTitle">그림일까, 공간일까.</h1></header>
  <div class="playback"><button id="replay" type="button" aria-label="처음부터 다시 보기" title="처음부터">↺</button><button id="play" type="button" aria-label="영상 일시정지" title="일시정지">Ⅱ</button></div>
  <section id="stage" aria-label="움직이는 원근법 모형">
    <canvas id="scene" tabindex="0" aria-label="원근법 시각 실험. 세 번째 장면에서 기둥을 좌우로, 네 번째 장면에서 눈을 위아래로 드래그하세요. 아래 슬라이더나 방향키로도 조작할 수 있습니다."></canvas>
    <span id="sceneStatus" class="sr-only" role="status"></span>
    <div id="assetError" role="status" hidden>작품을 불러오지 못했어요. <button id="retryArt" type="button">다시 불러오기</button></div>
  </section>
  <footer class="film-controls">
    <div class="interaction-row">
      <span id="gestureHint">옆으로 돌려보면</span>
      <label id="distanceControl" class="experiment-control" hidden><span>가까이</span><input id="distance" type="range" min="2" max="16" step="0.01" value="10" aria-label="청록색 기둥의 거리"><span>멀리</span></label>
      <label id="eyeControl" class="experiment-control" hidden><span>낮게</span><input id="eyeHeight" type="range" min="0.8" max="3.2" step="0.01" value="2" aria-label="관찰자의 눈높이"><span>높게</span></label>
      <button id="artLines" type="button" aria-pressed="true" hidden>안내선 끄기</button>
      <button id="next" type="button">다음 장면 <span aria-hidden="true">→</span></button>
    </div>
    <nav class="chapters" aria-label="시각 실험 장면">
      <button type="button" data-chapter="0" aria-current="step"><span class="chapter-line"><i></i></span><span><b>01</b> 평면의 비밀</span></button>
      <button type="button" data-chapter="1"><span class="chapter-line"><i></i></span><span><b>02</b> 눈 · 그림 · 공간</span></button>
      <button type="button" data-chapter="2"><span class="chapter-line"><i></i></span><span><b>03</b> 같은 크기</span></button>
      <button type="button" data-chapter="3"><span class="chapter-line"><i></i></span><span><b>04</b> 하나의 점</span></button>
      <button type="button" data-chapter="4"><span class="chapter-line"><i></i></span><span><b>05</b> 작품 속으로</span></button>
    </nav>
    <div class="footnote"><span id="filmTime">00:00 / 00:50</span><a id="artSource" href="https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/stanze-di-raffaello/stanza-della-segnatura/scuola-di-atene.html" target="_blank" rel="noopener noreferrer" hidden>라파엘로 · 아테네 학당 / 바티칸 미술관 ↗</a><span id="modelNote">원근법 원리 모형</span></div>
  </footer>
  <noscript>이 시각 실험은 JavaScript가 필요합니다.</noscript>
</main>
<script src="renaissance-model.js?v=visual-2"></script>
<script src="renaissance.js?v=visual-2"></script>
</body>
</html>
