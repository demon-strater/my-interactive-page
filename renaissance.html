<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renaissance</title>
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: #f6e6c5;
            background: #0a0806;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }

        body {
            display: grid;
            place-items: center;
            padding: clamp(18px, 3vw, 42px);
            background:
                linear-gradient(90deg, rgba(10, 8, 6, 0.92), rgba(10, 8, 6, 0.38) 46%, rgba(10, 8, 6, 0.9)),
                radial-gradient(circle at 50% 24%, rgba(231, 185, 96, 0.34), transparent 36%),
                #0a0806;
        }

        .perspective-room {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, transparent 49.9%, rgba(246, 220, 174, 0.18) 50%, transparent 50.1%),
                repeating-linear-gradient(90deg, transparent 0 8.2vw, rgba(246, 220, 174, 0.08) 8.25vw 8.32vw),
                repeating-linear-gradient(0deg, transparent 0 8.2vh, rgba(246, 220, 174, 0.06) 8.25vh 8.32vh);
            mask-image: radial-gradient(ellipse at 50% 42%, #000 0 58%, transparent 82%);
            opacity: 0.72;
        }

        .composition {
            position: relative;
            z-index: 1;
            width: min(1120px, 100%);
            height: min(720px, calc(100svh - 36px));
            display: grid;
            grid-template-columns: minmax(250px, 0.44fr) minmax(360px, 0.72fr);
            gap: clamp(18px, 4vw, 56px);
            align-items: center;
        }

        .copy {
            display: grid;
            gap: 14px;
            align-self: center;
        }

        .eyebrow {
            margin: 0;
            color: rgba(246, 230, 197, 0.58);
            font-size: 0.72rem;
            font-weight: 850;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(3rem, 7vw, 7.2rem);
            line-height: 0.86;
            letter-spacing: 0;
        }

        .note {
            max-width: 34ch;
            margin: 0;
            color: rgba(246, 230, 197, 0.68);
            font-size: clamp(0.82rem, 1.05vw, 1rem);
            font-weight: 650;
            line-height: 1.55;
        }

        .artwork {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            border: 1px solid rgba(246, 220, 174, 0.2);
            border-radius: 8px;
            overflow: hidden;
            background: #19100a;
            box-shadow: 0 34px 90px rgba(0, 0, 0, 0.46);
        }

        .artwork::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url('아테네 학당.jpg') center / cover no-repeat;
            filter: saturate(0.96) contrast(1.04);
            transform: scale(1.02);
        }

        .artwork::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(10, 8, 6, 0.2), transparent 34% 72%, rgba(10, 8, 6, 0.34)),
                radial-gradient(circle at 50% 42%, transparent 48%, rgba(10, 8, 6, 0.34));
        }

        .caption {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 14px;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid rgba(246, 230, 197, 0.16);
            border-radius: 8px;
            color: rgba(246, 230, 197, 0.86);
            background: rgba(10, 8, 6, 0.52);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        @media (max-width: 820px) {
            body {
                overflow: auto;
                place-items: start center;
            }

            .composition {
                height: auto;
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .artwork {
                min-height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="perspective-room" aria-hidden="true"></div>
    <main class="composition" aria-label="Renaissance perspective study">
        <section class="copy">
            <p class="eyebrow">Perspective And Order</p>
            <h1>Renaissance</h1>
            <p class="note">A balanced study of proportion, vanishing lines, and architectural space.</p>
        </section>
        <section class="artwork" aria-label="The School of Athens">
            <div class="caption">
                <span>Raffaello Sanzio</span>
                <span>1509-1511</span>
            </div>
        </section>
    </main>
</body>
</html>
