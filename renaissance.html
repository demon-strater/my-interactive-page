<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100e0b">
<title>르네상스 — 그림이 공간이 되는 순간</title>
<meta name="description" content="눈, 그림판, 공간을 연결하는 시각 실험. 움직이는 투영선과 기둥으로 원근법을 발견하고 아테네 학당으로 이어집니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="renaissance.css?v=play-2">
<link rel="stylesheet" href="renaissance-navigation.css?v=nav-2">
</head>
<body class="visual-experience">
<main id="atelier">
  <header class="masthead"><div class="eyebrow">RENAISSANCE</div><h1 id="sceneTitle">그림일까, 공간일까.</h1></header>
  <section id="stage" aria-label="움직이는 원근법 모형">
    <canvas id="scene" tabindex="0" aria-label="원근법 시각 실험. 세 번째 장면에서 기둥을 좌우로, 네 번째 장면에서 눈을 위아래로 드래그하세요. 아래 슬라이더나 방향키로도 조작할 수 있습니다."></canvas>
    <span id="sceneStatus" class="sr-only" role="status"></span>
    <figure class="art-compare" id="compareOne" aria-hidden="true">
      <h3 class="compare-heading">원근법이 있을 때와 없을 때</h3>
      <div class="compare-grid">
        <div class="compare-item">
          <span class="compare-tag">원근법 없음</span>
          <img src="원근법%20ㄴ.jpg" alt="여러 사물을 겹쳐 평면적으로 그린 책가도">
          <span class="compare-credit">책가도 · 작자 미상</span>
        </div>
        <div class="compare-item">
          <span class="compare-tag">원근법 있음</span>
          <img src="원근법ㅇ.jpg" alt="한 점으로 모이는 선이 뚜렷한 최후의 만찬">
          <span class="compare-credit">최후의 만찬 · 레오나르도 다빈치</span>
        </div>
      </div>
    </figure>
    <figure class="art-compare" id="compareTwo" aria-hidden="true">
      <h3 class="compare-heading">소실점의 위치가 바꾸는 느낌</h3>
      <div class="compare-grid three">
        <div class="compare-item">
          <span class="compare-tag">강렬하고 역동적인 느낌</span>
          <img src="소실점1.jpg" alt="소실점이 화면 오른쪽 높은 곳에 있는 유럽의 다리">
          <span class="compare-credit">유럽의 다리 · 귀스타브 카유보트</span>
        </div>
        <div class="compare-item">
          <span class="compare-tag">아늑하고 안정된 느낌</span>
          <img src="소실점2.jpg" alt="소실점이 눈높이 중앙에 있는 아를의 침실">
          <span class="compare-credit">아를의 침실 · 빈센트 반 고흐</span>
        </div>
        <div class="compare-item">
          <span class="compare-tag">균형 잡히고 장엄한 느낌</span>
          <img src="아테네%20학당.jpg" alt="소실점이 두 인물 사이 중앙에 놓인 아테네 학당">
          <span class="compare-credit">아테네 학당 · 라파엘로 산치오</span>
        </div>
      </div>
    </figure>
    <div id="assetError" role="status" hidden>작품을 불러오지 못했어요. <button id="retryArt" type="button">다시 불러오기</button></div>
  </section>
  <footer class="film-controls">
    <div class="interaction-row">
      <label id="distanceControl" class="experiment-control" hidden><span>가까이</span><input id="distance" type="range" min="2" max="16" step="0.01" value="10" aria-label="청록색 기둥의 거리"><span>멀리</span></label>
      <label id="eyeControl" class="experiment-control" hidden><span>낮게</span><input id="eyeHeight" type="range" min="0.8" max="3.2" step="0.01" value="2" aria-label="관찰자의 눈높이"><span>높게</span></label>
      <button id="artLines" type="button" aria-pressed="true" hidden>안내선 끄기</button>
      <a id="secondExperience" class="next-experience" href="renaissance-perspective.html?v=home-1" hidden>소실점 직접 찍어보기 <span aria-hidden="true">→</span></a>
    </div>
    <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="영상 흐름" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0" aria-valuetext="그림일까, 공간일까.">
      <div class="timeline-track" id="timelineTrack">
        <div class="timeline-tooltip" id="timelineTooltip" aria-hidden="true"></div>
        <div class="timeline-fill" id="timelineFill"></div>
        <span class="timeline-tick" style="left:16%"></span>
        <span class="timeline-tick" style="left:36%"></span>
        <span class="timeline-tick" style="left:60%"></span>
        <span class="timeline-tick" style="left:80%"></span>
      </div>
    </div>
    <div class="footnote"><span class="playhead"><button id="play" type="button" aria-label="영상 일시정지" title="일시정지">Ⅱ</button><span id="filmTime">00:00 / 00:50</span></span><a id="artSource" href="https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/stanze-di-raffaello/stanza-della-segnatura/scuola-di-atene.html" target="_blank" rel="noopener noreferrer" hidden>라파엘로 · 아테네 학당 / 바티칸 미술관 ↗</a><span id="modelNote">원근법 원리 모형</span></div>
  </footer>
  <noscript>이 시각 실험은 JavaScript가 필요합니다.</noscript>
</main>
<script src="renaissance-model.js?v=visual-4"></script>
<script src="renaissance.js?v=play-2"></script>
<script src="renaissance-navigation.js?v=nav-3"></script>
</body>
</html>
