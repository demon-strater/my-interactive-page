<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Futurism Acceleration</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12071b;color:#f7e3ff;font-family:Georgia,serif}#app{position:fixed;inset:0}.hud{position:fixed;left:24px;bottom:20px;pointer-events:none}h1{margin:0;color:#ff9cff;font-size:clamp(2rem,6vw,5rem);font-style:italic;font-weight:400;line-height:.9}p{max-width:390px;margin:10px 0 0;color:rgba(247,227,255,.62);font-size:12px;line-height:1.5}.actions{position:fixed;right:24px;top:24px;display:flex;gap:8px;z-index:3}.actions button{min-height:34px;border:1px solid rgba(255,156,255,.28);border-radius:999px;color:#ff9cff;background:rgba(18,7,27,.62);padding:0 12px;font:700 10px system-ui;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}</style></head>
<body><div id="app"></div><div class="actions" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()"><button id="burstBtn" type="button">Burst</button><button id="brakeBtn" type="button">Brake</button></div><section class="hud"><h1>Futurism</h1><p>Scroll slowly and the machine walks. Fling the wheel and its vertices stretch into speed. Drag to steer its path.</p></section>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';
const burstBtn=document.getElementById('burstBtn');
const brakeBtn=document.getElementById('brakeBtn');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x12071b);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,3,14);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x7546a0,1.5));const l=new THREE.DirectionalLight(0xffd7ff,2.5);l.position.set(3,7,5);scene.add(l);
const uniforms={uVelocity:{value:0},uTime:{value:0}};const mat=new THREE.MeshStandardMaterial({color:0xd05cff,roughness:.38,metalness:.45,onBeforeCompile:s=>{s.uniforms.uVelocity=uniforms.uVelocity;s.uniforms.uTime=uniforms.uTime;s.vertexShader='uniform float uVelocity;uniform float uTime;\n'+s.vertexShader.replace('#include <begin_vertex>','vec3 transformed=vec3(position); transformed.x += max(0.0,uVelocity-1.0)*position.y*.9; transformed.z += sin(position.y*8.0+uTime)*uVelocity*.09;')}});
const robot=new THREE.Group();scene.add(robot);
function part(g,x,y,z,sx,sy,sz){const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);robot.add(m);return m}
part(new THREE.BoxGeometry(1.5,2,1),0,1.2,0,1,1,1);part(new THREE.SphereGeometry(.55,32,16),0,2.65,0,1,1,1);part(new THREE.BoxGeometry(.35,1.5,.35),-.75,.15,0,1,1,1);part(new THREE.BoxGeometry(.35,1.5,.35),.75,.15,0,1,1,1);part(new THREE.BoxGeometry(.3,1.4,.3),-1.15,1.35,0,1,1,1);part(new THREE.BoxGeometry(.3,1.4,.3),1.15,1.35,0,1,1,1);
const trails=[];for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(1.8,3.4,1.2),new THREE.MeshBasicMaterial({color:0xff4cff,transparent:true,opacity:.025}));scene.add(m);trails.push(m)}
let velocity=0,last=performance.now();
addEventListener('wheel',e=>{const now=performance.now();velocity+=Math.min(8,Math.abs(e.deltaY)/(now-last)*.9);last=now},{passive:true});
burstBtn.addEventListener('click',()=>velocity=8);brakeBtn.addEventListener('click',()=>velocity=0);addEventListener('pointermove',e=>robot.position.y=THREE.MathUtils.lerp(robot.position.y,-(e.clientY/innerHeight-.5)*4,.08));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(t){requestAnimationFrame(animate);velocity*=.93;uniforms.uVelocity.value=velocity;uniforms.uTime.value=t*.01;robot.position.x=Math.sin(t*.001)*2;robot.rotation.y=Math.sin(t*.001)*.5;robot.children[2].rotation.x=Math.sin(t*.008)*.8;robot.children[3].rotation.x=-Math.sin(t*.008)*.8;trails.forEach((m,i)=>{m.position.copy(robot.position);m.position.x-=i*.18*velocity;m.rotation.copy(robot.rotation);m.scale.x=1+velocity*.32;m.material.opacity=Math.min(.09,velocity*.012)*(1-i/10)});renderer.render(scene,camera)}
animate(0);
</script></body></html>
