<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>구성주의 조립</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110b;color:#e7ffe9;font-family:Georgia,serif}#app{position:fixed;inset:0}.hud{position:fixed;left:clamp(14px,2.4vw,24px);bottom:clamp(14px,2.4vw,22px);max-width:min(430px,calc(100vw - 32px));padding:13px 14px;border:1px solid rgba(152,255,159,.18);border-radius:8px;background:rgba(7,17,11,.54);box-shadow:0 18px 52px rgba(0,0,0,.26);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none}h1{margin:0;color:#98ff9f;font-size:clamp(2rem,6vw,5rem);font-style:italic;font-weight:400;line-height:.9;text-wrap:balance}p{max-width:410px;margin:9px 0 0;color:rgba(231,255,233,.68);font:700 12px/1.45 Inter,system-ui,sans-serif}.actions{position:fixed;right:clamp(14px,2.4vw,24px);top:clamp(14px,2.4vw,24px);display:flex;flex-wrap:wrap;gap:8px;z-index:3;padding:6px;border:1px solid rgba(152,255,159,.16);border-radius:8px;background:rgba(7,17,11,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.actions button{min-height:36px;border:1px solid rgba(152,255,159,.28);border-radius:8px;color:#98ff9f;background:rgba(7,17,11,.62);padding:0 11px;font:800 10px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}@media(max-width:560px){.hud{right:14px}.actions{left:14px;justify-content:flex-end}}</style><script src="art-audio.js?v=4" defer></script></head>
<body><div id="app"></div><div class="actions" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()"><button data-part="a">빔</button><button data-part="s">기어</button><button data-part="d">파이프</button><button data-part="f">조인트</button></div><section class="hud"><h1>구성주의</h1><p>A/S/D/F 키를 누르거나 버튼을 탭해 산업 부품을 떨어뜨리세요. 부품을 가까이 끌어다 놓으면 기계 탑에 고정됩니다.</p></section>
<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
import { enhanceScene, roundedBox, material, mesh } from './art-quality.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07110b);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,4,16);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x9dff9d,1.2));const l=new THREE.DirectionalLight(0xffffff,2);l.position.set(4,9,6);scene.add(l);
enhanceScene(renderer,scene,{finish:'metal',floor:-3.5});
const parts=[],tower=new THREE.Group();scene.add(tower);const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0);let grabbed=null,hit=new THREE.Vector3();
const fastener=material('metal',0xd6d4c8);
function make(type){let geo;if(type==='a')geo=roundedBox(3,.35,.35,.035);else if(type==='s')geo=new THREE.TorusGeometry(.75,.16,32,128);else if(type==='d')geo=new THREE.CylinderGeometry(.22,.22,2.4,64,8);else geo=roundedBox(.8,.8,.8,.075);const m=new THREE.Mesh(geo,material('metal',{a:0xc73526,s:0xdcb651,d:0x427d6b,f:0x386391}[type],{metalness:.48,roughness:.3}));
 if(type==='a')for(const x of [-1.28,1.28])mesh(m,new THREE.CylinderGeometry(.065,.065,.024,6),fastener,[x,0,.184],[Math.PI/2,0,0]);
 if(type==='d')for(const y of [-1.05,1.05])mesh(m,new THREE.TorusGeometry(.224,.028,10,48),fastener,[0,y,0],[Math.PI/2,0,0]);
 m.position.set((Math.random()-.5)*8,7,0);m.userData={vel:new THREE.Vector3(0,-.035,0),snapped:false};scene.add(m);parts.push(m)}
addEventListener('keydown',e=>{if('asdf'.includes(e.key.toLowerCase()))make(e.key.toLowerCase())});
document.querySelectorAll('[data-part]').forEach(btn=>btn.addEventListener('click',()=>make(btn.dataset.part)));
function pick(e){mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera)}
addEventListener('pointerdown',e=>{pick(e);grabbed=ray.intersectObjects(parts,false)[0]?.object||null});
addEventListener('pointermove',e=>{pick(e);if(grabbed){ray.ray.intersectPlane(plane,hit);grabbed.position.lerp(hit,.6)}});
addEventListener('pointerup',()=>grabbed=null);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function snap(m){for(const o of parts){if(o===m||!o.userData.snapped)continue;if(m.position.distanceTo(o.position)<1.25){m.position.copy(o.position).add(new THREE.Vector3(0,.75,0));m.rotation.set(0,Math.round(m.rotation.y/(Math.PI/2))*Math.PI/2,0);m.userData.snapped=true;tower.add(m);return}}if(m.position.y<-3){m.position.y=-3;m.userData.snapped=true;tower.add(m)}}
function animate(){requestAnimationFrame(animate);parts.forEach(m=>{if(m!==grabbed&&!m.userData.snapped){m.userData.vel.y-=.001;m.position.add(m.userData.vel);snap(m)}else if(!m.userData.snapped&&m===grabbed)snap(m)});tower.rotation.y+=.002;renderer.render(scene,camera)}animate();
</script></body></html>
