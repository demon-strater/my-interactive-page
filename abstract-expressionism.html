<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Abstract Expressionism</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151006;color:#fff4d2;font-family:Georgia,serif}#app{position:fixed;inset:0}.hud{position:fixed;left:24px;bottom:20px;pointer-events:none}h1{margin:0;color:#ffe26a;font-size:clamp(2rem,5.5vw,4.8rem);font-style:italic;font-weight:400;line-height:.9}p{max-width:410px;margin:10px 0 0;color:rgba(255,244,210,.62);font-size:12px;line-height:1.5}.actions{position:fixed;right:24px;top:24px;display:flex;gap:8px;z-index:3}.actions button{min-height:34px;border:1px solid rgba(255,226,106,.3);border-radius:999px;color:#ffe26a;background:rgba(21,16,6,.62);padding:0 12px;font:700 10px system-ui;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}</style></head>
<body><div id="app"></div><div class="actions" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()"><button id="splatBtn" type="button">Splat</button><button id="clearBtn" type="button">Fresh Canvas</button></div><section class="hud"><h1>Abstract Expressionism</h1><p>Slow motion pools paint. Violent flicks permanently splatter the canvas texture.</p></section>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';
const splatBtn=document.getElementById('splatBtn');
const clearBtn=document.getElementById('clearBtn');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x151006);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.z=9;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').appendChild(renderer.domElement);
const paint=document.createElement('canvas');paint.width=1024;paint.height=640;const ctx=paint.getContext('2d');ctx.fillStyle='#f1e6c8';ctx.fillRect(0,0,paint.width,paint.height);
const tex=new THREE.CanvasTexture(paint);const plane=new THREE.Mesh(new THREE.PlaneGeometry(8,5),new THREE.MeshBasicMaterial({map:tex}));scene.add(plane);
let last=null,particles=[];
function color(){return ['#111111','#f04747','#ffd447','#265cff','#f7f2df'][Math.floor(Math.random()*5)]}
function drawBlob(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(.65,c+'cc');g.addColorStop(1,c+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function map(e){return{x:e.clientX/innerWidth*paint.width,y:e.clientY/innerHeight*paint.height,t:performance.now()}}
addEventListener('pointermove',e=>{const p=map(e);if(last){const dx=p.x-last.x,dy=p.y-last.y,dt=Math.max(16,p.t-last.t),v=Math.hypot(dx,dy)/dt;if(v<.55){drawBlob(p.x,p.y,18+30*(.55-v),color())}else{for(let i=0;i<Math.min(90,v*55);i++)particles.push({x:p.x,y:p.y,vx:dx/dt*(8+Math.random()*18)+(Math.random()-.5)*12,vy:dy/dt*(8+Math.random()*18)+(Math.random()-.5)*12,r:2+Math.random()*8,c:color(),life:30+Math.random()*50})}}last=p;tex.needsUpdate=true});
splatBtn.addEventListener('click',()=>{for(let i=0;i<160;i++)particles.push({x:paint.width/2,y:paint.height/2,vx:(Math.random()-.5)*38,vy:(Math.random()-.5)*26,r:2+Math.random()*10,c:color(),life:30+Math.random()*50})});
clearBtn.addEventListener('click',()=>{ctx.globalAlpha=1;ctx.fillStyle='#f1e6c8';ctx.fillRect(0,0,paint.width,paint.height);particles=[];tex.needsUpdate=true});
addEventListener('pointerleave',()=>last=null);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life--;ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,p.life/70);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;return p.life>0});if(particles.length)tex.needsUpdate=true;renderer.render(scene,camera)}animate();
</script></body></html>
