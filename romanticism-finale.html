<header class="masthead mf-head"><span class="mf-eyebrow">1798 – 1850</span><h1 class="mf-title">낭만주의</h1><p class="mf-sub">풍경에 담은 한 사람의 감정</p></header>
<section class="museum" data-world="sublime" aria-label="낭만주의 대표작">
<ol class="museum-wall" tabindex="0" aria-label="낭만주의 대표작 다섯 점. 좌우로 넘겨 감상하세요">
<li class="work"><figure><span class="work-frame"><img src="romanticism-wanderer.jpg" width="2327" height="2980" alt="안개 바다 위의 방랑자: 한 인물이 홀로 서서 광대한 안개 낀 산악 풍경을 바라보고 있다" decoding="async"></span><figcaption class="work-label"><strong>안개 바다 위의 방랑자</strong><em>Der Wanderer über dem Nebelmeer</em><span>카스파르 다비드 프리드리히 · 1818</span><p>얼굴 대신 뒷모습을 그려, 우리는 그의 눈으로 광대한 자연 앞에 선다.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="romanticism-turner-hannibal.jpg" width="1213" height="750" alt="터너가 그린 소용돌이치는 눈보라가 알프스를 넘는 한니발의 군대를 압도하는 모습" decoding="async"></span><figcaption class="work-label"><strong>눈보라: 알프스를 넘는 한니발과 그의 군대</strong><em>Snow Storm: Hannibal and his Army Crossing the Alps</em><span>J. M. W. 터너 · 1812</span><p>소용돌이치는 폭풍 아래 군대는 작은 점이 된다. 자연 앞에서 느끼는 두려움과 경외, 숭고.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/romanticism-raft-of-the-medusa.jpg" width="1800" height="1229" alt="제리코의 메두사호의 뗏목. 거친 바다 위 뗏목에 지친 생존자들이 뒤엉켜 있고, 한 사람이 천을 흔들며 먼 수평선을 향해 손짓한다" loading="lazy" decoding="async"></span><figcaption class="work-label"><strong>메두사호의 뗏목</strong><em>Le Radeau de la Méduse</em><span>테오도르 제리코 · 1818–1819</span><p>실제 난파 사건을 거대한 화폭에 담았다. 절망 끝에서 수평선의 배를 향해 손을 흔드는 사람들.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="romanticism-two-men-moon.jpg" width="1280" height="1002" alt="나란히 서서 달을 바라보는 두 남자의 뒷모습" loading="lazy" decoding="async"></span><figcaption class="work-label"><strong>달을 바라보는 두 남자</strong><em>Zwei Männer in Betrachtung des Mondes</em><span>카스파르 다비드 프리드리히 · 1819–1820</span><p>달빛 아래 나란히 선 두 사람의 뒷모습. 말없는 응시가 곧 그림의 이야기다.</p></figcaption></figure></li>
<li class="work"><figure><span class="work-frame"><img src="gallery/romanticism-liberty.jpg" width="1800" height="1425" alt="들라크루아의 민중을 이끄는 자유의 여신. 삼색기를 높이 든 여인이 쓰러진 사람들을 넘어 무장한 시민들을 이끌고 나아간다" loading="lazy" decoding="async"></span><figcaption class="work-label"><strong>민중을 이끄는 자유의 여신</strong><em>La Liberté guidant le peuple</em><span>외젠 들라크루아 · 1830</span><p>격렬한 색과 움직임으로 혁명의 열정을 그렸다. 이성보다 감정이 앞서는 낭만주의의 외침.</p></figcaption></figure></li>
</ol>
