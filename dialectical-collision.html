<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialectical Fluid Collision</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030407;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .fallback {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            color: #f4fbff;
            background: #030407;
            font-family: system-ui, sans-serif;
            font-size: 16px;
            letter-spacing: 0;
        }

        .hud {
            position: fixed;
            left: 50%;
            bottom: clamp(14px, 3vh, 24px);
            z-index: 3;
            width: min(560px, calc(100vw - 32px));
            min-height: 42px;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: max-content 1fr;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border: 1px solid rgba(219, 242, 255, 0.16);
            border-radius: 8px;
            color: rgba(244, 251, 255, 0.86);
            background: rgba(3, 4, 7, 0.58);
            box-shadow: 0 18px 52px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            pointer-events: none;
        }

        .hud strong {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hud span {
            color: rgba(244, 251, 255, 0.62);
            font-size: 11px;
            font-weight: 700;
            line-height: 1.35;
        }
    </style>
</head>
<body>
    <div class="fallback" id="fallback">WebGL unavailable</div>
    <div class="hud" aria-hidden="true"><strong>Collision</strong><span>Move across the canvas to shift pressure and temperature</span></div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

        (() => {
            const fallback = document.getElementById('fallback');

            const vertexShader = `
                varying vec2 v_uv;

                void main() {
                    v_uv = uv;
                    gl_Position = vec4(position.xy, 0.0, 1.0);
                }
            `;

            const fragmentShader = `
                precision highp float;

                uniform float u_time;
                uniform vec2 u_mouse;
                uniform float u_velocity;
                uniform float u_temperature;
                uniform vec2 u_resolution;

                varying vec2 v_uv;

                vec2 hash22(vec2 p) {
                    p = vec2(
                        dot(p, vec2(127.1, 311.7)),
                        dot(p, vec2(269.5, 183.3))
                    );
                    return fract(sin(p) * 43758.5453123);
                }

                float hash12(vec2 p) {
                    return fract(sin(dot(p, vec2(41.27, 289.19))) * 45758.5453);
                }

                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    vec2 u = f * f * (3.0 - 2.0 * f);

                    float a = hash12(i);
                    float b = hash12(i + vec2(1.0, 0.0));
                    float c = hash12(i + vec2(0.0, 1.0));
                    float d = hash12(i + vec2(1.0, 1.0));

                    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
                }

                float fbm(vec2 p) {
                    float value = 0.0;
                    float amplitude = 0.5;
                    mat2 rot = mat2(0.76, -0.65, 0.65, 0.76);

                    for (int i = 0; i < 6; i++) {
                        value += amplitude * noise(p);
                        p = rot * p * 2.03 + 11.7;
                        amplitude *= 0.52;
                    }

                    return value;
                }

                vec3 voronoi(vec2 p) {
                    vec2 n = floor(p);
                    vec2 f = fract(p);
                    float minDist = 8.0;
                    float secondDist = 8.0;
                    vec2 closest = vec2(0.0);

                    for (int y = -1; y <= 1; y++) {
                        for (int x = -1; x <= 1; x++) {
                            vec2 g = vec2(float(x), float(y));
                            vec2 o = hash22(n + g);
                            vec2 r = g + o - f;
                            float d = dot(r, r);

                            if (d < minDist) {
                                secondDist = minDist;
                                minDist = d;
                                closest = g + o;
                            } else if (d < secondDist) {
                                secondDist = d;
                            }
                        }
                    }

                    float cell = sqrt(minDist);
                    float edge = sqrt(secondDist) - sqrt(minDist);
                    float facets = hash12(n + floor(closest * 13.0));
                    return vec3(cell, edge, facets);
                }

                vec2 flow(vec2 p, float thermal, float phase) {
                    float t = u_time * thermal;
                    vec2 q = p;

                    for (int i = 0; i < 4; i++) {
                        float scale = 1.85 + float(i) * 0.9;
                        vec2 curl = vec2(
                            fbm(q * scale + vec2(t * (0.34 + phase), -t * 0.21)),
                            fbm(q * scale + vec2(-t * 0.25, t * (0.31 + phase)))
                        ) - 0.5;
                        q += curl * (0.18 * thermal);
                    }

                    return q;
                }

                vec3 metalMedium(vec2 p, float structure, float crystal, float edge) {
                    float bands = sin((p.x - p.y) * 18.0 + structure * 8.0);
                    float mirror = pow(abs(bands), 7.0);
                    float ridge = pow(clamp(structure, 0.0, 1.0), 2.8);
                    vec3 darkSteel = vec3(0.015, 0.018, 0.021);
                    vec3 chrome = vec3(0.92, 0.96, 1.0);
                    vec3 hotSpec = vec3(1.0, 0.77, 0.32);
                    vec3 coldFacet = vec3(0.55, 0.82, 1.0);

                    vec3 color = mix(darkSteel, chrome, mirror * 0.9 + ridge * 0.35);
                    color += hotSpec * pow(max(0.0, 1.0 - abs(p.x * 1.4 + p.y * 0.35)), 8.0) * 0.75;
                    color = mix(color, coldFacet * (0.28 + crystal * 0.9), crystal * smoothstep(0.055, 0.0, edge));
                    return color;
                }

                vec3 glassMedium(vec2 p, float structure, float crystal, float edge) {
                    float caustic = pow(abs(sin(structure * 18.0 + p.x * 5.0)), 12.0);
                    float depth = smoothstep(0.05, 0.9, structure);
                    vec3 aqua = vec3(0.02, 0.78, 0.92);
                    vec3 violet = vec3(0.42, 0.2, 0.95);
                    vec3 clear = vec3(0.9, 1.0, 0.96);
                    vec3 ice = vec3(0.65, 0.96, 1.0);

                    vec3 color = mix(aqua * 0.24, violet * 0.56, depth);
                    color += clear * caustic * 0.9;
                    color += vec3(0.02, 0.24, 0.32) * (1.0 - depth);
                    color = mix(color, ice * (0.22 + crystal), crystal * smoothstep(0.07, 0.0, edge));
                    return color;
                }

                float boundaryField(vec2 p, float thermal) {
                    float divide = p.x;
                    divide += (fbm(p * 2.0 + u_time * 0.13 * thermal) - 0.5) * 0.58 * thermal;
                    divide += sin(p.y * 2.8 + u_time * 0.5 * thermal) * 0.09 * thermal;
                    divide += (fbm(p * 7.5 - u_time * 0.21 * thermal) - 0.5) * 0.11 * thermal;
                    return divide;
                }

                vec3 sampleScene(vec2 p, float channelOffset) {
                    float temp = clamp(u_temperature, 0.0, 1.0);
                    float freeze = 1.0 - temp;
                    float thermal = temp * temp;
                    float speedImpulse = clamp(u_velocity, 0.0, 1.0);
                    vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
                    vec2 mouse = (u_mouse - 0.5) * aspect;

                    float boundaryRaw = boundaryField(p, thermal);
                    float boundary = smoothstep(0.145, 0.0, abs(boundaryRaw));
                    vec2 normal = normalize(vec2(
                        boundaryField(p + vec2(0.006, 0.0), thermal) - boundaryField(p - vec2(0.006, 0.0), thermal),
                        boundaryField(p + vec2(0.0, 0.006), thermal) - boundaryField(p - vec2(0.0, 0.006), thermal)
                    ) + vec2(0.0001));

                    float mouseWave = exp(-length(p - mouse) * 4.2);
                    vec2 collisionWarp = normal * boundary * speedImpulse * (0.34 + mouseWave * 0.26);
                    collisionWarp += vec2(-normal.y, normal.x) * sin(u_time * 12.0 + p.y * 24.0) * boundary * speedImpulse * 0.055;
                    collisionWarp *= thermal;

                    vec2 q = flow(p + collisionWarp + normal * channelOffset * boundary * (0.08 + speedImpulse * 0.12), thermal, channelOffset);
                    vec3 cells = voronoi(q * mix(4.0, 10.5, freeze) + vec2(8.0, -3.0));
                    float liquid = fbm(q * 4.4 + channelOffset * 0.8);
                    float crystalStructure = clamp(1.0 - cells.x * 1.35, 0.0, 1.0);
                    float structure = mix(liquid, crystalStructure, smoothstep(0.15, 0.95, freeze));
                    float facetEdge = cells.y;

                    vec3 metal = metalMedium(q, structure, freeze, facetEdge);
                    vec3 glass = glassMedium(q + normal * liquid * 0.08, structure, freeze, facetEdge);
                    float side = smoothstep(-0.035, 0.035, boundaryRaw);
                    vec3 color = mix(metal, glass, side);

                    float contactLight = boundary * (0.55 + speedImpulse * 1.9);
                    color += vec3(1.0, 0.84, 0.42) * contactLight * (1.0 - side) * 0.5;
                    color += vec3(0.25, 0.9, 1.0) * contactLight * side * 0.7;
                    color += vec3(0.92, 0.16, 1.0) * pow(boundary, 3.0) * speedImpulse * 0.95;

                    float fracture = smoothstep(0.035, 0.0, facetEdge) * freeze;
                    color += vec3(0.88, 1.0, 1.0) * fracture * 0.65;
                    color *= 0.62 + smoothstep(1.85, 0.15, length(p)) * 0.55;
                    return color;
                }

                void main() {
                    vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
                    vec2 p = (v_uv - 0.5) * aspect;
                    float temp = clamp(u_temperature, 0.0, 1.0);
                    float freeze = 1.0 - temp;
                    float speedImpulse = clamp(u_velocity, 0.0, 1.0);
                    float boundary = smoothstep(0.18, 0.0, abs(boundaryField(p, temp * temp)));
                    float split = boundary * (0.006 + speedImpulse * 0.055) * (0.35 + temp);

                    vec3 red = sampleScene(p + vec2(split, -split * 0.24), 1.0);
                    vec3 green = sampleScene(p, 0.0);
                    vec3 blue = sampleScene(p - vec2(split, -split * 0.18), -1.0);

                    vec3 color = vec3(red.r, green.g, blue.b);
                    color += vec3(1.0, 0.08, 0.04) * boundary * speedImpulse * 0.22;
                    color += vec3(0.0, 0.75, 1.0) * boundary * speedImpulse * 0.28;
                    color = mix(color, floor(color * 10.0) / 10.0 + color * 0.35, freeze * 0.18);
                    color = pow(max(color, vec3(0.0)), vec3(0.82));

                    gl_FragColor = vec4(color, 1.0);
                }
            `;

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                powerPreference: 'high-performance'
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const geometry = new THREE.PlaneGeometry(2, 2);
            const uniforms = {
                u_time: { value: 0 },
                u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
                u_velocity: { value: 0 },
                u_temperature: { value: 1.0 },
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            };
            const material = new THREE.ShaderMaterial({
                uniforms,
                vertexShader,
                fragmentShader
            });
            const plane = new THREE.Mesh(geometry, material);
            scene.add(plane);

            const pointer = {
                x: window.innerWidth * 0.5,
                y: window.innerHeight * 0.5,
                lastX: window.innerWidth * 0.5,
                lastY: window.innerHeight * 0.5,
                lastTime: performance.now()
            };

            function updateMouse(event) {
                const now = performance.now();
                const dt = Math.max(16, now - pointer.lastTime);
                const dx = event.clientX - pointer.lastX;
                const dy = event.clientY - pointer.lastY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const kinetic = Math.min(1, distance / dt * 0.85);

                uniforms.u_mouse.value.set(
                    event.clientX / window.innerWidth,
                    1 - event.clientY / window.innerHeight
                );
                uniforms.u_velocity.value = Math.max(uniforms.u_velocity.value, kinetic);

                pointer.lastX = event.clientX;
                pointer.lastY = event.clientY;
                pointer.lastTime = now;
            }

            window.addEventListener('pointermove', updateMouse, { passive: true });
            window.addEventListener('wheel', event => {
                const direction = event.deltaY < 0 ? -1 : 1;
                uniforms.u_temperature.value = THREE.MathUtils.clamp(
                    uniforms.u_temperature.value + direction * 0.08,
                    0.0,
                    1.0
                );
            }, { passive: true });

            window.addEventListener('resize', () => {
                const width = window.innerWidth;
                const height = window.innerHeight;
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.setSize(width, height);
                uniforms.u_resolution.value.set(width, height);
            });

            function animate(time) {
                uniforms.u_time.value = time * 0.001;
                uniforms.u_velocity.value *= 0.92;
                if (uniforms.u_velocity.value < 0.0005) {
                    uniforms.u_velocity.value = 0;
                }
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
