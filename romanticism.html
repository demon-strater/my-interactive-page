<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romanticism — The Sublime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1220;color:#eef2fb;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair;outline:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scene:focus-visible{box-shadow:inset 0 0 0 2px #ffdf9e88}
header{position:absolute;left:5%;top:7%;z-index:2;pointer-events:none;max-width:min(560px,60%)}
header span{font:9px/1.7 Arial,sans-serif;letter-spacing:.2em;color:#d9e3ffa8}
header h1{font:italic clamp(24px,4.2vw,58px)/1.03 Georgia,serif;font-weight:400;letter-spacing:-.03em;margin:14px 0 0;color:#f5f7ff;text-shadow:0 4px 26px #00000070}
.tag{position:absolute;left:5%;bottom:6.5%;z-index:2;display:flex;align-items:center;gap:10px;pointer-events:none}
.tag span{font:9px/1.6 Arial,sans-serif;letter-spacing:.18em;color:#c9d6f088}
.tag strong{font:italic 15px Georgia,serif;font-weight:400;color:#f3e6c8;letter-spacing:.02em}
.tag i{width:26px;height:1px;background:#c9d6f044;display:block;font-style:normal}
.mood{position:absolute;left:4.5%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:3}
.mood-icon{width:14px;height:14px;display:block}
.slider-wrap{width:36px;height:168px;display:flex;align-items:center;justify-content:center}
#temperament{-webkit-appearance:none;appearance:none;width:168px;height:36px;background:transparent;transform:rotate(90deg);cursor:pointer;margin:0}
#temperament::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,#ffd98a,#98a9c9,#232a3d)}
#temperament::-moz-range-track{height:3px;border-radius:3px;background:linear-gradient(90deg,#ffd98a,#98a9c9,#232a3d)}
#temperament::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff6e2;border:1px solid #caa15a;box-shadow:0 0 10px #ffdf9e88,0 2px 6px #00000070;margin-top:-6.5px}
#temperament::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff6e2;border:1px solid #caa15a}
#temperament:focus-visible{outline:none}
#temperament:focus-visible::-webkit-slider-thumb{outline:2px solid #ffdf9e;outline-offset:3px}
.mood small{writing-mode:vertical-rl;font-size:7px;letter-spacing:.24em;color:#c9d6f077}
.wanderer-speech{position:absolute;left:53.5%;bottom:41%;transform:translateX(-50%) translateY(9px);width:min(288px,64vw);z-index:4;background:linear-gradient(180deg,#111c33e6,#0b1524ee);color:#e7ecfb;border:1px solid #cfe0ff2b;border-radius:13px;padding:12px 15px 14px;box-shadow:0 16px 40px #00000078,0 0 0 1px #ffffff10 inset;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);font:12.5px/1.72 "Nanum Myeongjo",Georgia,serif;letter-spacing:.004em;opacity:0;transition:opacity .5s ease,transform .5s ease;pointer-events:none}
.wanderer-speech.show{opacity:1;transform:translateX(-50%) translateY(0)}
.wanderer-speech::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:9px solid transparent;border-bottom:0;border-top-color:#0b1524ee}
.wanderer-speech .ws-kicker{display:block;font:italic 9.5px/1.5 Georgia,serif;letter-spacing:.2em;color:#f0e2c4bb;margin:0 0 6px}
.wanderer-speech p{margin:0}
@media(max-width:640px){
  header{top:6%;max-width:82%}
  header h1{font-size:27px}
  .tag{bottom:13%}
  .mood{left:3%}
  .slider-wrap{width:30px;height:124px}
  #temperament{width:124px;height:30px}
  .wanderer-speech{bottom:45%;width:78vw;font-size:11.5px;line-height:1.72;padding:11px 13px 12px}
}
@media(prefers-reduced-motion:reduce){#temperament{transition:none}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="A wanderer above a sea of fog. Move the cursor to part the mist; he turns his head to watch it. Scroll to move the sky from dawn to tempest. Press and hold anywhere (or hold Enter) to drive wind and rain toward the pointer — the storm builds while held and falls calm when released. Click the wanderer for a note on Romanticism."></canvas>
<header><span>CASPAR DAVID FRIEDRICH / 1818</span><h1>Wanderer<br>above the fog.</h1></header>
<div class="tag"><span>ROMANTICISM</span><i></i><strong id="moodLabel">Dawn</strong></div>
<div class="mood">
<svg class="mood-icon" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="#ffd98a"/></svg>
<div class="slider-wrap"><input id="temperament" type="range" min="0" max="1" step=".001" value=".16" aria-label="Shift the sky from serene dawn to tempest"></div>
<svg class="mood-icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 9.4a2.6 2.6 0 0 1 4.9-1.3A2.1 2.1 0 0 1 9.4 9.4H2Z" fill="#9fb2d8"/><path d="M5.6 10.4 4.4 13l1.7-.3-1 2.3" stroke="#dbe4f7" stroke-width=".9" fill="none" stroke-linecap="round"/></svg>
<small>SERENITY&nbsp;—&nbsp;TEMPEST</small>
</div>
<div class="wanderer-speech" id="wandererSpeech" role="status" hidden>
<span class="ws-kicker">낭만주의 · ROMANTICISM</span>
<p>18세기 말, 낭만주의는 이성과 규칙에 맞서 태어났다. 개인의 감정과 상상력, 그리고 거대한 자연 앞에서 느끼는 숭고함을 예술의 중심에 두었다. 안개 너머를 응시하는 방랑자처럼, 낭만주의는 알 수 없는 세계와 홀로 마주 선 인간을 그린다.</p>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene'), ctx = canvas.getContext('2d');
  const temperamentInput = document.getElementById('temperament');
  const moodLabel = document.getElementById('moodLabel');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, f) => a + (b - a) * f;
  const lerpColor = (a, b, f) => [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)];
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  let width = 1, height = 1, dpr = 1;
  let pointer = { x: .5, y: .5, active: false };
  let temperament = Number(temperamentInput.value);
  let displayTemperament = temperament;
  let elapsed = 0, last = 0, raf = 0;
  let lightning = 0, lightningTimer = 1.4;
  const birds = [];

  const TAU = Math.PI * 2;
  const finePointer = matchMedia('(pointer: fine)').matches;
  let headLook = 0, parallaxX = 0, parallaxY = 0;
  // storm: sustained while a pointer is held down, dying away when released
  const gust = { held: false, dir: 1, power: 0, turb: 0, v: 0, sv: 0 };

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    width = innerWidth; height = innerHeight;
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
  }
  addEventListener('resize', resize);

  function setPointer(e) { pointer.x = e.clientX / width; pointer.y = e.clientY / height; pointer.active = true; }
  canvas.addEventListener('pointermove', setPointer, { passive: true });
  canvas.addEventListener('pointerenter', () => pointer.active = true);
  canvas.addEventListener('pointerleave', () => { pointer.active = false; if (gust.held) endHold(); });
  canvas.addEventListener('pointermove', e => {
    canvas.style.cursor = hitWanderer(e.clientX, e.clientY) ? 'pointer' : 'crosshair';
  }, { passive: true });

  temperamentInput.addEventListener('input', () => { temperament = Number(temperamentInput.value); });

  // Turn the wheel to move the sky along the same 0..1 temperament the slider drives.
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const scale = e.deltaMode === 1 ? .04 : e.deltaMode === 2 ? .32 : .0012;
    temperament = clamp(temperament + e.deltaY * scale, 0, 1);
    temperamentInput.value = temperament.toFixed(3);
  }, { passive: false });

  // A speech bubble above the figure — a short note on Romanticism, toggled by clicking the wanderer.
  const speech = document.getElementById('wandererSpeech');
  let speechVisible = false, speechTimer = 0;
  function toggleSpeech(force) {
    speechVisible = force != null ? force : !speechVisible;
    clearTimeout(speechTimer);
    if (speechVisible) {
      speech.hidden = false;
      requestAnimationFrame(() => speech.classList.add('show'));
    } else {
      speech.classList.remove('show');
      speechTimer = setTimeout(() => { if (!speechVisible) speech.hidden = true; }, 520);
    }
  }
  addEventListener('keydown', e => { if (e.key === 'Escape' && speechVisible) toggleSpeech(false); });

  function spawnBirds(x, y) {
    const count = 3 + Math.floor(Math.random() * 3);
    const dir = x < width / 2 ? 1 : -1;
    for (let i = 0; i < count; i++) {
      birds.push({
        x: x + (Math.random() - .5) * 50, y: y + (Math.random() - .5) * 34,
        vx: dir * (66 + Math.random() * 44), vy: -6 + Math.random() * 8,
        phase: Math.random() * 10, age: 0
      });
    }
  }
  function hitWanderer(px, py) {
    const fx = width * .535, ground = height * .75;
    return px > fx - 52 && px < fx + 52 && py > ground - 108 && py < ground + 28;
  }
  // ── Hold to summon a storm ───────────────────────────────────────────────
  // While a pointer is held down the storm blows toward it and keeps building;
  // release and it falls calm. Direction and force track the pointer live.
  function beginHold(cx, cy, pointerId) {
    if (hitWanderer(cx, cy)) { toggleSpeech(); return; }
    if (pointerId != null && canvas.setPointerCapture) { try { canvas.setPointerCapture(pointerId); } catch (e) {} }
    pointer.x = cx / width; pointer.y = cy / height; pointer.active = true;
    gust.held = true;
    gust.dir = cx < width * .535 ? -1 : 1;
    startStormAudio();
    if (gust.power < .12) spawnBirds(width * (.52 - gust.dir * .12), height * clamp(cy / height, .16, .42));
  }
  function endHold() {
    if (!gust.held) return;
    gust.held = false;
    stopStormAudio();
  }
  canvas.addEventListener('pointerdown', e => beginHold(e.clientX, e.clientY, e.pointerId));
  canvas.addEventListener('pointerup', endHold);
  canvas.addEventListener('pointercancel', endHold);
  canvas.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' || gust.held) return;
    e.preventDefault();
    pointer.x = headLook >= 0 ? .8 : .2; pointer.y = .28;
    beginHold(pointer.x * width, pointer.y * height, null);
  });
  canvas.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') endHold(); });
  canvas.addEventListener('blur', endHold);

  // A wanderer's sky: three temperament stops — dawn, overcast day, tempest — sampled and blended live.
  const skyStops = [
    { top: [66, 92, 148], mid: [186, 165, 150], horizon: [255, 213, 158] },
    { top: [66, 80, 104], mid: [126, 134, 148], horizon: [172, 178, 188] },
    { top: [7, 9, 16], mid: [16, 20, 32], horizon: [34, 31, 40] }
  ];
  function sampleSky(t) {
    if (t <= .5) { const f = t / .5; return { top: lerpColor(skyStops[0].top, skyStops[1].top, f), mid: lerpColor(skyStops[0].mid, skyStops[1].mid, f), horizon: lerpColor(skyStops[0].horizon, skyStops[1].horizon, f) }; }
    const f = (t - .5) / .5; return { top: lerpColor(skyStops[1].top, skyStops[2].top, f), mid: lerpColor(skyStops[1].mid, skyStops[2].mid, f), horizon: lerpColor(skyStops[1].horizon, skyStops[2].horizon, f) };
  }
  function drawSky(sky) {
    const g = ctx.createLinearGradient(0, 0, 0, height * .8);
    g.addColorStop(0, rgb(sky.top)); g.addColorStop(.55, rgb(sky.mid)); g.addColorStop(1, rgb(sky.horizon));
    ctx.fillStyle = g; ctx.fillRect(0, 0, width, height * .82);
  }
  function drawStars(t) {
    const a = clamp((t - .55) * 2.2, 0, 1);
    if (a <= 0) return;
    for (let i = 0; i < 70; i++) {
      const x = (((Math.sin(i * 127.1 + 3) * 43758.5453) % 1) + 1) % 1 * width;
      const y = (((Math.sin(i * 311.7 + 8) * 19341.17) % 1) + 1) % 1 * height * .48;
      const tw = reduced.matches ? .75 : .5 + .5 * Math.sin(elapsed * 1.3 + i);
      ctx.globalAlpha = a * (.28 + tw * .5);
      ctx.fillStyle = '#eaf1ff'; ctx.beginPath(); ctx.arc(x, y, i % 7 === 0 ? 1.3 : .7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawOrb(t) {
    const x = width * .74 - parallaxX * 5, y = height * (.3 + t * .05) - parallaxY * 3;
    const core = t < .5 ? [255, 240, 205] : [214, 224, 255];
    const glowA = clamp(1 - t * 1.5, .12, 1);
    const r = width * .13;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, rgb(core, .85 * glowA)); grad.addColorStop(1, rgb(core, 0));
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(core, .8 * glowA); ctx.beginPath(); ctx.arc(x, y, width * .012, 0, Math.PI * 2); ctx.fill();
  }

  function ridgeY(xf, layer) {
    const freqs = [1.1, 2.3, 4.7, 8.1], amps = [.05, .026, .013, .007];
    let y = 0;
    for (let i = 0; i < 4; i++) y += Math.sin(xf * freqs[i] * Math.PI * 2 + layer * 11.3 + i * 3.7) * amps[i] * (1 + layer * .12);
    return y;
  }
  function drawMountains(t, sky) {
    const layers = 5;
    for (let L = 0; L < layers; L++) {
      const near = L / (layers - 1);                 // 0 = far ridge … 1 = near ridge
      const base = height * (.40 + L * .075);
      const sx = -parallaxX * (5 + near * 26), sy = -parallaxY * (2 + near * 12);
      ctx.beginPath(); ctx.moveTo(-14, height);
      const steps = 48;
      for (let i = -2; i <= steps + 2; i++) {
        const xf = i / steps;
        ctx.lineTo(xf * width + sx, base + sy + ridgeY(xf, L) * height * 1.4);
      }
      ctx.lineTo(width + 14, height); ctx.closePath();
      const farF = 1 - L / (layers - 1);
      const rockCool = [42, 50, 66], rockWarm = [92, 70, 54];
      const rockBase = lerpColor(rockCool, rockWarm, t < .4 ? (1 - t / .4) * .4 : 0);
      ctx.fillStyle = rgb(lerpColor(rockBase, sky.horizon, .16 + farF * .64 + t * .12));
      ctx.fill();
    }
  }

  const fogPuffs = [];
  let fogScroll = 0;
  (function buildFog() {
    for (let i = 0; i < 64; i++) {
      const row = i % 6;
      fogPuffs.push({ xf: (i * 0.6180339887) % 1, row, speed: .01 + row * .0045, size: .13 + Math.random() * .07, wobble: Math.random() * Math.PI * 2 });
    }
  })();
  function drawFog(t, sky, push, dt) {
    // A dense, overlapping bank of puffs — each one individually parted by the cursor — reads as a
    // continuous sea of cloud filling the valley, per the painting, rather than scattered wisps.
    const rows = 6, fogBaseY = height * .54, fogSpanY = height * .27;
    const ap = Math.abs(push || 0);
    // Integrate the drift so a rising wind speeds the fog up smoothly (never a jump),
    // and let a gust push the whole bank toward the cursor's side.
    const windSpeed = (.16 + t * .6) + (push || 0) * 5;
    fogScroll += (dt || 0) * windSpeed;
    const fogColor = t > .55 ? [148, 157, 174] : [240, 236, 224];
    for (const p of fogPuffs) {
      const rowFrac = p.row / rows;
      let y = fogBaseY + rowFrac * fogSpanY + (reduced.matches ? 0 : Math.sin(elapsed * .6 + p.wobble) * 6);
      let x = (((p.xf + fogScroll * p.speed) % 1.2) - .1) * width;
      x += -parallaxX * 24 * (.4 + rowFrac) + (push || 0) * width * .05 * (.4 + rowFrac);
      y += -parallaxY * 9 * (.3 + rowFrac) - ap * 8 * (.3 + rowFrac);
      const size = width * p.size * (.75 + rowFrac * .6) * (1 + ap * .28);
      let alpha = (.26 + t * .16 + rowFrac * .13) * (1 + ap * .28);
      if (pointer.active) {
        const dx = x - pointer.x * width, dy = y - pointer.y * height;
        const dist = Math.hypot(dx, dy);
        const clear = clamp(1 - dist / (200 + rowFrac * 50), 0, 1);
        if (clear > 0) { alpha *= 1 - clear * .92; x += (dx / (dist || 1)) * clear * 60; }
      }
      const grad = ctx.createRadialGradient(x, y, 0, x, y, size);
      grad.addColorStop(0, rgb(fogColor, alpha)); grad.addColorStop(1, rgb(fogColor, 0));
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawBird(b) {
    const flap = Math.sin(b.age * 10 + b.phase) * 9;
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.strokeStyle = 'rgba(18,16,24,.7)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.quadraticCurveTo(-4, -6 - flap * .3, 0, 0); ctx.quadraticCurveTo(4, -6 + flap * .3, 9, 0); ctx.stroke();
    ctx.restore();
  }
  function updateBirds(dt) {
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i]; b.age += dt;
      b.x += b.vx * dt; b.y += b.vy * dt + Math.sin(b.age * 3 + b.phase) * 8 * dt;
      if (b.age > 10 || b.x < -40 || b.x > width + 40) birds.splice(i, 1);
    }
  }

  function drawForegroundLedge() {
    ctx.save();
    ctx.translate(-parallaxX * 14, -parallaxY * 5);
    ctx.beginPath();
    ctx.moveTo(-24, height + 26); ctx.lineTo(-24, height * .92);
    ctx.quadraticCurveTo(width * .22, height * .80, width * .36, height * .855);
    ctx.quadraticCurveTo(width * .445, height * .895, width * .5, height * .78);
    ctx.quadraticCurveTo(width * .555, height * .70, width * .62, height * .835);
    ctx.quadraticCurveTo(width * .76, height * .92, width, height * .87);
    ctx.lineTo(width + 24, height + 26); ctx.closePath();
    ctx.fillStyle = '#050508'; ctx.fill();
    ctx.restore();
  }
  // The original Rückenfigur silhouette: a simple back view — coat, two legs,
  // an oval head, a walking cane. The head turns gently to follow the cursor.
  function drawWanderer(wind) {
    const fx = width * .535 - parallaxX * 10, ground = height * .735 - parallaxY * 4;
    const lean = clamp(gust.sv, -1, 1) * 3.6;                       // a nudge in the wind's direction
    const sway = (reduced.matches ? .3 : Math.sin(elapsed * 1.6)) * wind * 3 + lean;
    ctx.save(); ctx.translate(fx, ground);
    ctx.fillStyle = 'rgba(6,5,8,.97)';
    ctx.fillRect(-7, -2, 6, 24); ctx.fillRect(2, -2, 6, 24);
    ctx.translate(0, -2);
    ctx.beginPath();
    ctx.moveTo(-11, -44);
    ctx.quadraticCurveTo(-21 - sway, -8, -17 - sway * 1.4, 18);
    ctx.lineTo(17 + sway * 1.4, 18);
    ctx.quadraticCurveTo(21 + sway, -8, 11, -44);
    ctx.quadraticCurveTo(0, -50, -11, -44);
    ctx.closePath(); ctx.fill();
    const hx = headLook * 3.4, hy = -52 - Math.abs(headLook) * .7;
    ctx.beginPath(); ctx.ellipse(hx, hy, 7, 8, headLook * .12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(6,5,8,.92)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(13, -28); ctx.lineTo(23 + sway * .6, 22); ctx.stroke();
    ctx.restore();
  }

  const rainDrops = [];
  (function buildRain() {
    for (let i = 0; i < 240; i++) rainDrops.push({
      x: Math.random(), y: Math.random(),
      z: .45 + Math.random() * .55,          // depth: near drops fall faster / longer / brighter
      speed: 0.9 + Math.random() * 0.5
    });
  })();
  // A field of parallel drops all driven along one wind vector, wrapping on every
  // edge — so a gust looks like rain sweeping across toward the cursor, not popping.
  function drawRain(power, dt, windX) {
    if (power <= 0.001) return;
    const shown = Math.floor(rainDrops.length * clamp(power * 1.1, .06, 1));
    for (let pass = 0; pass < 2; pass++) {
      // pass 0: far, faint, thin.  pass 1: near, brighter.
      ctx.strokeStyle = `rgba(206,218,240,${(pass ? .34 : .16) * clamp(power * 1.3, 0, 1)})`;
      ctx.lineWidth = pass ? 1.3 : 1;
      ctx.beginPath();
      for (let i = pass; i < shown; i += 2) {
        const d = rainDrops[i];
        const vx = windX * d.z;                       // px/s sideways
        const vy = (520 + d.z * 520) * d.speed;       // px/s down
        if (dt) {
          d.x += (vx * dt) / width;
          d.y += (vy * dt) / height;
        }
        if (d.y > 1.04) { d.y -= 1.08; d.x = Math.random(); }
        else if (d.y < -.04) d.y += 1.08;
        if (d.x > 1.05) d.x -= 1.1; else if (d.x < -.05) d.x += 1.1;
        const px = d.x * width, py = d.y * height;
        const m = Math.hypot(vx, vy) || 1;
        const len = (9 + d.z * 15) + Math.min(1, Math.abs(windX) / 260) * (8 + d.z * 26);
        ctx.moveTo(px, py);
        ctx.lineTo(px - (vx / m) * len, py - (vy / m) * len);
      }
      ctx.stroke();
    }
  }
  // Broad translucent sheets of rain drifting across in the wind's direction — the
  // large-scale "몰아치는" gesture behind the individual drops.
  function drawRainSheets(power, windX) {
    if (power < .1) return;
    const dir = windX >= 0 ? 1 : -1;
    const slant = clamp(windX / 520, -1.1, 1.1) * height * .5;
    const n = 3;
    for (let i = 0; i < n; i++) {
      const cyc = ((elapsed * (.045 + power * .11) + i / n) % 1 + 1) % 1;
      const cx = (dir > 0 ? cyc * 1.6 - .3 : 1.3 - cyc * 1.6) * width;
      const w = width * (.42 + power * .34);
      const a = Math.sin(cyc * Math.PI) * .05 * power;
      if (a <= .001) continue;
      const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
      g.addColorStop(0, 'rgba(202,214,236,0)');
      g.addColorStop(.5, `rgba(202,214,236,${a})`);
      g.addColorStop(1, 'rgba(202,214,236,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(cx - w / 2 + slant, -20);
      ctx.lineTo(cx + w / 2 + slant, -20);
      ctx.lineTo(cx + w / 2 - slant, height + 20);
      ctx.lineTo(cx - w / 2 - slant, height + 20);
      ctx.closePath(); ctx.fill();
    }
  }

  let audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }
  function noiseBuffer(seconds, decayPow) {
    const n = Math.max(1, Math.floor(audioCtx.sampleRate * seconds));
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (decayPow ? Math.pow(1 - i / n, decayPow) : 1);
    return buf;
  }
  function playThunder(delay, gain) {
    const ac = ensureAudio(); if (!ac) return;
    delay = delay || 0; gain = gain == null ? .8 : gain;
    const now = ac.currentTime + delay;
    const master = ac.createGain(); master.gain.value = .4; master.connect(ac.destination);
    const src = ac.createBufferSource(); src.buffer = noiseBuffer(1.9, 1.4);
    const low = ac.createBiquadFilter(); low.type = 'lowpass';
    low.frequency.setValueAtTime(360, now); low.frequency.exponentialRampToValueAtTime(85, now + 1.7);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(gain, now + .05);
    g.gain.exponentialRampToValueAtTime(Math.max(.12, gain * .35), now + .5);
    g.gain.exponentialRampToValueAtTime(.001, now + 1.8);
    src.connect(low); low.connect(g); g.connect(master); src.start(now); src.stop(now + 1.95);
  }
  // A sustained storm bed: three looping noise layers (wind / low rumble / rain
  // hiss) glued by a compressor, gently gusted by two LFOs so it never drones.
  let stormAudio = null;
  function loopNoise(ac) {
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(2, 0); src.loop = true;
    return src;
  }
  function startStormAudio() {
    const ac = ensureAudio(); if (!ac || stormAudio) return;
    const now = ac.currentTime;
    const master = ac.createGain(); master.gain.value = 0;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 4; comp.attack.value = .01; comp.release.value = .25;
    master.connect(comp);
    let pan = null;
    if (ac.createStereoPanner) { pan = ac.createStereoPanner(); comp.connect(pan); pan.connect(ac.destination); }
    else comp.connect(ac.destination);

    const wind = loopNoise(ac);
    const windFilter = ac.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.Q.value = .55; windFilter.frequency.value = 480;
    const freqLfo = ac.createOscillator(); freqLfo.type = 'sine'; freqLfo.frequency.value = .16;
    const freqLfoGain = ac.createGain(); freqLfoGain.gain.value = 300;
    freqLfo.connect(freqLfoGain); freqLfoGain.connect(windFilter.frequency);
    const windGain = ac.createGain(); windGain.gain.value = 0;
    const ampLfo = ac.createOscillator(); ampLfo.type = 'sine'; ampLfo.frequency.value = .26;
    const ampLfoGain = ac.createGain(); ampLfoGain.gain.value = .1;
    ampLfo.connect(ampLfoGain); ampLfoGain.connect(windGain.gain);
    wind.connect(windFilter); windFilter.connect(windGain); windGain.connect(master);

    const rumble = loopNoise(ac);
    const rumbleFilter = ac.createBiquadFilter(); rumbleFilter.type = 'lowpass'; rumbleFilter.frequency.value = 120;
    const rumbleGain = ac.createGain(); rumbleGain.gain.value = 0;
    rumble.connect(rumbleFilter); rumbleFilter.connect(rumbleGain); rumbleGain.connect(master);

    const rain = loopNoise(ac);
    const rainFilter = ac.createBiquadFilter(); rainFilter.type = 'highpass'; rainFilter.frequency.value = 1650;
    const rainGain = ac.createGain(); rainGain.gain.value = 0;
    rain.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(master);

    [wind, rumble, rain, freqLfo, ampLfo].forEach(n => n.start(now));
    master.gain.setTargetAtTime(.7, now, .9);
    stormAudio = { ac, master, pan, windGain, windFilter, rumbleGain, rainGain,
      nodes: [wind, rumble, rain, freqLfo, ampLfo] };
  }
  function updateStormAudio(power, dir) {
    if (!stormAudio) return;
    const { ac, windGain, windFilter, rumbleGain, rainGain, pan } = stormAudio;
    const now = ac.currentTime;
    windGain.gain.setTargetAtTime(.2 + power * .5, now, .3);
    windFilter.frequency.setTargetAtTime(340 + power * 900, now, .5);
    rumbleGain.gain.setTargetAtTime(power * .34, now, .4);
    rainGain.gain.setTargetAtTime(Math.max(0, power - .32) * .3, now, .5);
    if (pan) pan.pan.setTargetAtTime(clamp(dir * .5, -1, 1), now, .25);
  }
  function stopStormAudio() {
    const s = stormAudio; if (!s) return;
    stormAudio = null;
    const now = s.ac.currentTime;
    s.master.gain.cancelScheduledValues(now);
    s.master.gain.setTargetAtTime(0, now, .7);
    setTimeout(() => {
      s.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
      try { s.master.disconnect(); } catch (e) {}
      if (s.pan) { try { s.pan.disconnect(); } catch (e) {} }
    }, 2600);
  }
  function maybeLightning(t, dt) {
    lightningTimer -= dt;
    if (t > .66 && lightningTimer <= 0) {
      const far = clamp((t - .66) / .34, .18, 1);          // faint & distant until a real tempest
      lightning = Math.max(lightning, .28 + far * .55);
      playThunder(.12 + Math.random() * .4, .32 + far * .5);
      lightningTimer = 3 + Math.random() * 6 * (1.6 - t);
    }
    lightning *= reduced.matches ? 0 : .87;
    if (lightning < .01) lightning = 0;
  }

  function drawVignette() {
    const boost = gust.v * .28;
    const g = ctx.createRadialGradient(width / 2, height * .55, height * .2, width / 2, height * .55, height * .88);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${.4 + boost})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, width, height);
  }
  function drawLightning() {
    if (lightning <= 0) return;
    ctx.fillStyle = `rgba(225,232,255,${lightning * .5})`;
    ctx.fillRect(0, 0, width, height);
  }

  function updateMoodLabel(t) {
    const label = t < .32 ? 'Dawn' : t < .5 ? 'Overcast' : t < .78 ? 'Storm Wind' : 'Tempest';
    if (moodLabel.textContent !== label) moodLabel.textContent = label;
  }

  function frame(now) {
    raf = 0;
    const dt = last ? Math.min((now - last) / 1000, .05) : 0; last = now;
    elapsed += dt;
    displayTemperament += (temperament - displayTemperament) * Math.min(1, dt * (reduced.matches ? 8 : 2.2));

    // storm: build toward a target while held, ebb away when released
    if (gust.held) {
      const dirTarget = pointer.x < .535 ? -1 : 1;
      gust.dir += (dirTarget - gust.dir) * Math.min(1, dt * 2.2);      // direction eases, never snaps
      const want = clamp(1.1 - pointer.y, .45, 1);                     // hold higher for a fiercer storm
      gust.power += (want - gust.power) * Math.min(1, dt * .8);        // ~1.2s natural build
    } else {
      gust.power += (0 - gust.power) * Math.min(1, dt * .5);          // ~2s die-down
      if (gust.power < .003) gust.power = 0;
    }
    // gustiness: layered slow fluctuation so the wind never sits still
    const flutter = reduced.matches ? .88
      : .8 + .2 * (Math.sin(elapsed * 1.5) * .5 + Math.sin(elapsed * 3.1 + 1) * .3 + Math.sin(elapsed * .6) * .2);
    gust.turb = gust.power * flutter;
    gust.v = gust.turb;
    gust.sv = gust.turb * gust.dir;
    if (gust.power > .01) updateStormAudio(gust.power, gust.dir);

    const renderT = clamp(displayTemperament + gust.turb * .34, 0, 1);
    const windPx = (renderT - .42) * 70 + gust.sv * 560;              // horizontal wind for rain / sheets
    const rainPower = Math.max(clamp((renderT - .5) * 2.2, 0, 1), gust.v * .9);
    const sky = sampleSky(renderT);
    updateBirds(dt);
    if (!reduced.matches) maybeLightning(renderT, dt); else lightning = 0;
    updateMoodLabel(displayTemperament);

    // cursor-driven life: the wanderer's gaze, and layered parallax across the vista
    const pact = finePointer && pointer.active && !reduced.matches;
    const lookT = pact ? clamp((pointer.x - .535) * 2.4, -1, 1) : 0;
    const pxT = pact ? clamp(pointer.x - .5, -.5, .5) : 0;
    const pyT = pact ? clamp(pointer.y - .5, -.5, .5) : 0;
    const es = Math.min(1, dt * 3);
    headLook += (lookT - headLook) * es;
    parallaxX += (pxT - parallaxX) * es;
    parallaxY += (pyT - parallaxY) * es;

    const sc = canvas.width / width, scy = canvas.height / height;
    // a gentle low-frequency buffet while the storm blows — the wind leaning on you,
    // not a jitter.
    const buf = reduced.matches ? 0 : gust.v;
    const shx = buf ? (Math.sin(elapsed * 5.7) * 1.4 + Math.sin(elapsed * 9.3 + 1) * .6) * buf : 0;
    const shy = buf ? Math.sin(elapsed * 4.6 + 2) * 1 * buf : 0;
    ctx.setTransform(sc, 0, 0, scy, shx * sc, shy * scy);
    ctx.clearRect(-8, -8, width + 16, height + 16);
    drawSky(sky);
    drawStars(displayTemperament);
    drawOrb(renderT);
    birds.forEach(drawBird);
    drawMountains(renderT, sky);
    drawFog(renderT, sky, gust.sv, dt);
    drawRainSheets(rainPower, windPx);
    drawRain(rainPower, dt, windPx);
    drawForegroundLedge();
    drawWanderer(clamp(renderT * 1.3, 0, 1.3));
    drawVignette();
    drawLightning();

    raf = requestAnimationFrame(frame);
  }
  function start() { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { endHold(); cancelAnimationFrame(raf); raf = 0; } else start();
  });
  resize(); start();
})();
</script>
</body>
</html>
