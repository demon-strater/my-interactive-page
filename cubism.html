<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cubism Collage</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a101a;color:#def8ff;font-family:Georgia,serif}#app{position:fixed;inset:0}.hud{position:fixed;left:clamp(14px,2.4vw,24px);bottom:clamp(14px,2.4vw,22px);max-width:min(420px,calc(100vw - 32px));padding:13px 14px;border:1px solid rgba(142,232,255,.18);border-radius:8px;background:rgba(10,16,26,.54);box-shadow:0 18px 52px rgba(0,0,0,.26);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none}h1{margin:0;color:#8ee8ff;font-size:clamp(2rem,6vw,5rem);font-style:italic;font-weight:400;line-height:.9;text-wrap:balance}p{max-width:380px;margin:9px 0 0;color:rgba(222,248,255,.68);font:700 12px/1.45 Inter,system-ui,sans-serif}.actions{position:fixed;right:clamp(14px,2.4vw,24px);top:clamp(14px,2.4vw,24px);display:flex;flex-wrap:wrap;gap:8px;z-index:3;padding:6px;border:1px solid rgba(142,232,255,.16);border-radius:8px;background:rgba(10,16,26,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.actions button{min-height:36px;border:1px solid rgba(142,232,255,.28);border-radius:8px;color:#8ee8ff;background:rgba(10,16,26,.62);padding:0 11px;font:800 10px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}@media(max-width:560px){.hud{right:14px}.actions{left:14px;justify-content:flex-end}}</style></head>
<body><div id="app"></div><div class="actions" id="actions" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()"><button id="captureBtn" type="button">Capture</button><button id="flattenBtn" type="button">Flatten</button><button id="clearBtn" type="button">Clear</button></div><section class="hud"><h1>Cubism</h1><p>Click to collect viewpoints. Spin the wheel to crush them into one simultaneous plane.</p></section>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.164.1/build/three.module.js';
const actions=document.getElementById('actions');
const captureBtn=document.getElementById('captureBtn');
const flattenBtn=document.getElementById('flattenBtn');
const clearBtn=document.getElementById('clearBtn');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a101a);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,2,14);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x9fefff,1));const l=new THREE.DirectionalLight(0xffffff,2);l.position.set(4,8,5);scene.add(l);
const object=new THREE.Group();scene.add(object);
[new THREE.BoxGeometry(2,2,2),new THREE.ConeGeometry(1.3,2,4),new THREE.TorusKnotGeometry(.75,.22,80,12)].forEach((g,i)=>{const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:[0xffcf5c,0x5ce1ff,0xff5c9a][i],roughness:.45}));m.position.x=(i-1)*1.1;object.add(m)});
const planes=[];let flatten=0;
function capture(){const url=renderer.domElement.toDataURL('image/png');new THREE.TextureLoader().load(url,tex=>{const mat=new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,transparent:true,opacity:.82});const p=new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.7),mat);const a=planes.length*.9;p.position.set(Math.cos(a)*4,(Math.random()-.5)*3,Math.sin(a)*4);p.rotation.set((Math.random()-.5)*.8,a,(Math.random()-.5)*.5);scene.add(p);planes.push(p)})}
addEventListener('click',capture);addEventListener('wheel',e=>{flatten=Math.min(1,Math.max(0,flatten+Math.sign(e.deltaY)*.13))},{passive:true});
actions.addEventListener('click',e=>e.stopPropagation());captureBtn.addEventListener('click',capture);flattenBtn.addEventListener('click',()=>flatten=1);clearBtn.addEventListener('click',()=>{planes.splice(0).forEach(p=>scene.remove(p));flatten=0});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(t){requestAnimationFrame(animate);object.rotation.x=t*.0004;object.rotation.y=t*.0007;planes.forEach((p,i)=>{p.position.z=THREE.MathUtils.lerp(Math.sin(i)*4,0,flatten);p.rotation.x*=1-flatten*.08;p.rotation.y*=1-flatten*.08;p.material.opacity=.45+flatten*.45});renderer.render(scene,camera)}
animate(0);
</script></body></html>
