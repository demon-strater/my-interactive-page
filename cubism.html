<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>입체파 콜라주</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a101a;color:#def8ff;font-family:Georgia,serif}#app{position:fixed;inset:0}.hud{position:fixed;left:clamp(14px,2.4vw,24px);bottom:clamp(14px,2.4vw,22px);max-width:min(420px,calc(100vw - 32px));padding:13px 14px;border:1px solid rgba(142,232,255,.18);border-radius:8px;background:rgba(10,16,26,.54);box-shadow:0 18px 52px rgba(0,0,0,.26);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none}h1{margin:0;color:#8ee8ff;font-size:clamp(2rem,6vw,5rem);font-style:italic;font-weight:400;line-height:.9;text-wrap:balance}p{max-width:380px;margin:9px 0 0;color:rgba(222,248,255,.68);font:700 12px/1.45 Inter,system-ui,sans-serif}.actions{position:fixed;right:clamp(14px,2.4vw,24px);top:clamp(14px,2.4vw,24px);display:flex;flex-wrap:wrap;gap:8px;z-index:3;padding:6px;border:1px solid rgba(142,232,255,.16);border-radius:8px;background:rgba(10,16,26,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.actions button{min-height:36px;border:1px solid rgba(142,232,255,.28);border-radius:8px;color:#8ee8ff;background:rgba(10,16,26,.62);padding:0 11px;font:800 10px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}@media(max-width:560px){.hud{right:14px}.actions{left:14px;justify-content:flex-end}}</style><script src="art-audio.js?v=4" defer></script></head>
<body><div id="app"></div><div class="actions" id="actions" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()"><button id="captureBtn" type="button">캡처</button><button id="flattenBtn" type="button">평면화</button><button id="clearBtn" type="button">지우기</button></div><section class="hud"><h1>입체파</h1><p>클릭해서 여러 시점을 모으세요. 휠을 돌리면 하나의 동시적 평면으로 압축됩니다.</p></section>
<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
import { enhanceScene, material, vessel, box, mesh } from './art-quality.js';
const actions=document.getElementById('actions');
const captureBtn=document.getElementById('captureBtn');
const flattenBtn=document.getElementById('flattenBtn');
const clearBtn=document.getElementById('clearBtn');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a101a);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,2,14);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('app').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x9fefff,1));const l=new THREE.DirectionalLight(0xffffff,2);l.position.set(4,8,5);scene.add(l);
enhanceScene(renderer,scene,{finish:'wood',floor:-2.5});
const object=new THREE.Group();scene.add(object);
const bottle=vessel(material('ceramic',0x376d78),{height:3.5,radius:.82});bottle.position.set(-1.3,-1.55,0);object.add(bottle);
const jug=vessel(material('ceramic',0xd4a365),{height:2.65,radius:1.13,style:'urn'});jug.position.set(.85,-1.55,.18);object.add(jug);
mesh(object,new THREE.TorusGeometry(.7,.105,20,80,Math.PI*1.65),material('metal',0xc0a16d),[1.62,-.1,.18],[0,0,-Math.PI*.82]);
const book=box(object,material('wood',0xa3523f),[0,-1.8,.8],[3.7,.32,2.15],.045);book.rotation.y=-.16;
box(object,material('cloth',0xd9cfb3),[0,-1.78,.82],[3.62,.18,2.16],.015);
mesh(object,new THREE.SphereGeometry(.64,64,40),material('ceramic',0xd1a94d),[.2,-.99,1]);
const planes=[];let flatten=0;
function capture(){const url=renderer.domElement.toDataURL('image/png');new THREE.TextureLoader().load(url,tex=>{const mat=new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,transparent:true,opacity:.82});const p=new THREE.Mesh(new THREE.PlaneGeometry(4.4,2.7),mat);const a=planes.length*.9;p.position.set(Math.cos(a)*4,(Math.random()-.5)*3,Math.sin(a)*4);p.rotation.set((Math.random()-.5)*.8,a,(Math.random()-.5)*.5);scene.add(p);planes.push(p)})}
addEventListener('click',capture);addEventListener('wheel',e=>{flatten=Math.min(1,Math.max(0,flatten+Math.sign(e.deltaY)*.13))},{passive:true});
actions.addEventListener('click',e=>e.stopPropagation());captureBtn.addEventListener('click',capture);flattenBtn.addEventListener('click',()=>flatten=1);clearBtn.addEventListener('click',()=>{planes.splice(0).forEach(p=>scene.remove(p));flatten=0});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(t){requestAnimationFrame(animate);object.rotation.x=t*.0004;object.rotation.y=t*.0007;planes.forEach((p,i)=>{p.position.z=THREE.MathUtils.lerp(Math.sin(i)*4,0,flatten);p.rotation.x*=1-flatten*.08;p.rotation.y*=1-flatten*.08;p.material.opacity=.45+flatten*.45});renderer.render(scene,camera)}
animate(0);
</script></body></html>
